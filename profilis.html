<!doctype html>
<html lang="lt">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Timurita – Profilis</title>
  <meta name="description" content="Naudotojo profilis – Timurita platforma." />

  <!-- PWA ir stiliai -->
  <link rel="manifest" href="/timurita/manifest.json">
  <meta name="theme-color" content="#1a2a44">
  <link rel="icon" href="/timurita/Timurita_logo_192x192.png" type="image/png">
  <link rel="stylesheet" href="/timurita/style.css">

  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background:#f8fafc; margin:0; }
    .app-header { display:flex; align-items:center; gap:10px; padding:12px 16px; background:#fff; border-bottom:1px solid #e2e8f0; }
    .app-header img { width:40px; height:40px; border-radius:8px; }
    .container { max-width:640px; margin:0 auto; padding:16px; }
    .card { background:#fff; border:1px solid #e2e8f0; border-radius:12px; padding:16px; box-shadow:0 1px 2px rgba(0,0,0,0.04); }
    label { display:block; margin-top:12px; font-weight:600; color:#334155; }
    input { width:100%; padding:10px; border:1px solid #cbd5e1; border-radius:8px; margin-top:4px; }
    button.btn { width:100%; margin-top:16px; padding:12px; font-size:16px; font-weight:600; background:#0f766e; color:#fff; border:none; border-radius:10px; cursor:pointer; }
    button.btn:hover { background:#115e59; }
    nav.bottom-nav { position:sticky; bottom:0; display:grid; grid-template-columns:repeat(4,1fr); background:#ffffffcc; backdrop-filter: blur(6px); border-top:1px solid #e2e8f0; padding:10px; }
    .bottom-nav a { text-align:center; text-decoration:none; padding:10px; border-radius:10px; color:#0f172a; font-weight:600; background:#fff; border:1px solid #e2e8f0; }
  </style>
</head>

<body>
  <header class="app-header">
    <a href="/timurita/index.html" style="display:flex;align-items:center;text-decoration:none;color:inherit">
      <img src="/timurita/Timurita_logo_192x192.png" alt="Timurita logotipas">
      <div>
        <h3 style="margin:0;">Timurita</h3>
        <div style="font-size:12px;color:#475569;">Sujungiame darbdavius ir statybų specialistus</div>
      </div>
    </a>
  </header>

  <main class="container">
    <h1>Naudotojo profilis</h1>
    <p>Užpildykite savo informaciją. Duomenys išsaugomi jūsų įrenginyje ir išlieka net offline režimu.</p>

    <form id="profileForm" class="card">
      <label>Vardas
        <input name="name" required placeholder="Pvz. Jonas Statybininkas">
      </label>
      <label>Telefonas
        <input name="phone" type="tel" placeholder="+370...">
      </label>
      <label>Miestas
        <input name="city" placeholder="Pvz. Vilnius">
      </label>
      <button class="btn" type="submit">Išsaugoti</button>
    </form>
  </main>

  <nav class="bottom-nav">
    <a href="/timurita/darbuotojai.html">Darbuotojai</a>
    <a href="/timurita/pasiulymai.html">Pasiūlymai</a>
    <a href="/timurita/profilis.html">Profilis</a>
    <a href="/timurita/darbdavys.html">Darbdavys</a>
  </nav>

  <!-- PWA ir IndexedDB logika -->
  <script type="module">
    import { saveProfile, loadProfile } from '/timurita/db.js';

    const form = document.querySelector('#profileForm');
    const ID = 'user-1'; // demo naudotojo ID (kol nėra registracijos sistemos)

    // 1) Užkraunam esamą profilį, jei toks yra
    const existing = await loadProfile(ID);
    if (existing) {
      if (form.elements.name)  form.elements.name.value  = existing.name  ?? '';
      if (form.elements.phone) form.elements.phone.value = existing.phone ?? '';
      if (form.elements.city)  form.elements.city.value  = existing.city  ?? '';
    }

    // 2) Išsaugom duomenis IndexedDB viduje
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const profile = {
        id: ID,
        name:  form.elements.name?.value?.trim()  || '',
        phone: form.elements.phone?.value?.trim() || '',
        city:  form.elements.city?.value?.trim()  || ''
      };
      await saveProfile(profile);
      alert('✅ Profilis išsaugotas lokaliai (IndexedDB).');
    });
  </script>

  <!-- Service Worker registracija -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/timurita/service-worker.js')
        .then(() => console.log('Service worker registered'))
        .catch(err => console.warn('SW error', err));
    }
  </script>
</body>
</html>
