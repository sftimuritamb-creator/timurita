<!doctype html>
<html lang="lt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Mano profilis – darbuotojas – Timurita</title>

  <link rel="stylesheet" href="./style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.48.0/dist/umd/supabase.js"></script>

  <style>
    body { background:#020617; color:#e5e7eb; }

    /* Role meniu – toks pats kaip pasiulymai.html */
    .role-menu {
      display:flex;
      gap:10px;
      overflow-x:auto;
      padding:10px;
      background:#0f172a;
      border-bottom:1px solid #1f2937;
    }
    .role-menu button {
      flex:0 0 auto;
      padding:8px 14px;
      border-radius:8px;
      background:#1e293b;
      color:white;
      border:1px solid #334155;
      font-size:14px;
      white-space:nowrap;
      cursor:pointer;
    }
    .role-menu button.active {
      background:#0369a1;
      border-color:#0ea5e9;
    }

    label {
      display:block;
      margin:8px 0 4px;
      font-size:14px;
      font-weight:600;
    }
    input, select, textarea {
      width:100%;
      padding:8px;
      border-radius:8px;
      border:1px solid #1e293b;
      background:#020617;
      color:#e5e7eb;
      margin-bottom:8px;
      font-size:14px;
    }
    textarea { min-height:80px; resize:vertical; }

    .required::after {
      content:" *";
      color:#ef4444;
      font-weight:bold;
    }

    .status-pill {
      display:inline-block;
      padding:3px 9px;
      border-radius:999px;
      font-size:12px;
      margin-top:4px;
    }
    .status-approved {
      background:#022c22;
      color:#6ee7b7;
      border:1px solid #22c55e;
    }
    .status-pending {
      background:#1f2937;
      color:#fbbf24;
      border:1px solid #facc15;
    }
    .status-blocked {
      background:#450a0a;
      color:#fecaca;
      border:1px solid #b91c1c;
    }

    .info-text {
      font-size:13px;
      color:#9ca3af;
      margin-bottom:10px;
    }
  </style>
</head>

<body>

<header class="app-header">
  <h2>Mano profilis</h2>
</header>

<!-- ROLE-BASED MENIU -->
<nav class="role-menu" id="roleMenu" style="display:none;">
  <!-- Darbuotojas -->
  <div id="menu-worker" style="display:none;">
    <button onclick="location.href='pasiulymai.html'">Pasiūlymai</button>
    <button onclick="location.href='profilis.html'">Mano profilis</button>
    <button onclick="location.href='patvirtintos-kandidaturos.html'">Patvirtintos kandidatūros</button>
  </div>

  <!-- Darbdavys (jei netyčia patektų) -->
  <div id="menu-employer" style="display:none;">
    <button onclick="location.href='darbdavys.html'">Sukurti pasiūlymą</button>
    <button onclick="location.href='darbdavio-profilis.html'">Mano profilis</button>
    <button onclick="location.href='mano-pasiulymai.html'">Mano pasiūlymai</button>
    <button onclick="location.href='kandidatai.html'">Kandidatai</button>
  </div>
</nav>

<main class="container">
  <div class="card">
    <h3>Darbuotojo profilis</h3>
    <p class="info-text" id="profileInfo">
      Čia galite užpildyti ir atnaujinti savo informaciją. Patvirtinti darbuotojai gali kandidatuoti į darbus.
    </p>

    <div id="statusBox" class="info-text"></div>

    <form id="profileForm">
      <label class="required" for="full_name">Vardas</label>
      <input id="full_name" type="text" placeholder="Jūsų vardas">

      <label class="required" for="city">Miestas</label>
      <select id="city">
        <option value="Vilnius">Vilnius</option>
      </select>

      <label class="required" for="phone">Telefonas</label>
      <input id="phone" type="text" placeholder="+370...">

      <label for="email">El. paštas</label>
      <input id="email" type="email" disabled>

      <label class="required" for="iv_nr">Individualios veiklos nr.</label>
      <input id="iv_nr" type="text" placeholder="IV numeris">

      <label for="description">Trumpai apie save</label>
      <textarea id="description" placeholder="Patirtis, sritys, kada galite dirbti ir pan."></textarea>

      <button type="submit" class="btn">💾 Išsaugoti profilį</button>
    </form>

    <p id="msg" class="info-text" style="margin-top:8px;"></p>
  </div>
</main>

<script>
  const supabaseClient = supabase.createClient(
    "https://qnczakppadjxbicgjzcy.supabase.co",
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFuY3pha3BwYWRqeGJpY2dqemN5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjI5NTYxMjcsImV4cCI6MjA3ODUzMjEyN30.0lAl6L1GU1_uWpULlraaKM0KIfy3lCNSI_wp2X5zDmY"
  );

  let currentUser = null;
  let currentProfile = null;

  const profileForm = document.getElementById("profileForm");
  const msgEl       = document.getElementById("msg");
  const statusBox   = document.getElementById("statusBox");

  // 🔄 INIT
  (async () => {
    const { data: u } = await supabaseClient.auth.getUser();
    if (!u.user) {
      location.href = "./auth.html";
      return;
    }
    currentUser = u.user;

    const { data: p, error: pErr } = await supabaseClient
      .from("profiles")
      .select("*")
      .eq("id", currentUser.id)
      .maybeSingle();

    if (pErr) {
      msgEl.textContent = "Klaida kraunant profilį: " + pErr.message;
      return;
    }

    // jei profilio nėra – sukuriam bazinį
    if (!p) {
      const baseProfile = {
        id: currentUser.id,
        role: currentUser.user_metadata?.role || "worker",
        email: currentUser.email,
        created_at: new Date().toISOString()
      };

      const { data: created, error: createErr } = await supabaseClient
        .from("profiles")
        .insert(baseProfile)
        .select()
        .single();

      if (createErr) {
        msgEl.textContent = "Klaida kuriant profilį: " + createErr.message;
        return;
      }
      currentProfile = created;
    } else {
      currentProfile = p;
    }

    // ADMIN → admin
    if (currentProfile.role === "admin") {
      location.href = "./admin.html";
      return;
    }

    // DARBDAVYS → darbdavio profilis
    if (currentProfile.role === "employer") {
      location.href = "./darbdavio-profilis.html";
      return;
    }

    // DARBUOTOJAS – rodom meniu ir formą
    if (currentProfile.role === "worker") {
      document.getElementById("roleMenu").style.display = "flex";
      document.getElementById("menu-worker").style.display = "flex";
      highlightActive("Mano profilis");
    }

    // Užblokuotas?
    if (currentProfile.is_blocked) {
      statusBox.innerHTML = `
        <span class="status-pill status-blocked">Paskyra užblokuota</span>
        <br>Jei manote, kad tai klaida – susisiekite su administracija.
      `;
    } else if (currentProfile.is_approved) {
      statusBox.innerHTML = `
        <span class="status-pill status-approved">Paskyra patvirtinta</span>
        <br>Dabar galite kandidatuoti į darbo pasiūlymus.
      `;
    } else {
      statusBox.innerHTML = `
        <span class="status-pill status-pending">Laukia patvirtinimo</span>
        <br>Administratorius peržiūrės jūsų duomenis ir patvirtins paskyrą.
      `;
    }

    fillForm();
  })();

  function highlightActive(label) {
    document.querySelectorAll(".role-menu button").forEach(btn => {
      if (btn.textContent.trim() === label) {
        btn.classList.add("active");
      }
    });
  }

  function fillForm() {
    if (!currentProfile) return;

    document.getElementById("full_name").value  = currentProfile.full_name || "";
    document.getElementById("city").value       = currentProfile.city || "Vilnius";
    document.getElementById("phone").value      = currentProfile.phone || "";
    document.getElementById("email").value      = currentProfile.email || currentUser.email || "";
    document.getElementById("iv_nr").value      = currentProfile.iv_nr || "";
    document.getElementById("description").value= currentProfile.description || "";
  }

  profileForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    msgEl.textContent = "";

    const full_name = document.getElementById("full_name").value.trim();
    const city      = document.getElementById("city").value;
    const phone     = document.getElementById("phone").value.trim();
    const email     = document.getElementById("email").value.trim() || currentUser.email;
    const iv_nr     = document.getElementById("iv_nr").value.trim();
    const description = document.getElementById("description").value.trim();

    if (!full_name || !city || !phone || !iv_nr) {
      msgEl.textContent = "Prašome užpildyti visus privalomus laukus.";
      msgEl.style.color = "#fecaca";
      return;
    }

    const payload = {
      id: currentUser.id,
      role: "worker",
      full_name,
      city,
      phone,
      email,
      iv_nr,
      description
    };

    const { error } = await supabaseClient
      .from("profiles")
      .upsert(payload, { onConflict: "id" });

    if (error) {
      msgEl.textContent = "Klaida išsaugant profilį: " + error.message;
      msgEl.style.color = "#fecaca";
      return;
    }

    msgEl.textContent = "Profilis išsaugotas sėkmingai.";
    msgEl.style.color = "#a7f3d0";
  });

  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("./service-worker.js")
      .catch(e => console.log("SW error profilis.html", e));
  }
</script>

</body>
</html>
