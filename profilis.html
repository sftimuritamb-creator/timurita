<!doctype html>
<html lang="lt">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Darbuotojo profilis – Timurita</title>

  <link rel="stylesheet" href="./style.css" />
  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#1a2a44" />

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.48.0/dist/umd/supabase.js"></script>

  <style>
    label {
      display:block;
      margin:8px 0 4px;
      font-weight:600;
      font-size:14px;
    }
    input, textarea {
      width:100%;
      padding:8px;
      border-radius:8px;
      border:1px solid #1e293b;
      background:#0f172a;
      color:#e2e8f0;
      margin-bottom:10px;
    }
    .required::after {
      content:" *";
      color:#ef4444;
      font-weight:bold;
    }
  </style>
</head>

<body>

<header class="app-header">
  <h2>Darbuotojo profilis</h2>
  <button onclick="logout()" class="btn small" style="margin-left:auto;">Atsijungti</button>
</header>

<main class="container">

  <div class="card">
    <h3>Mano duomenys</h3>

    <form id="profileForm">

      <label class="required">Vardas</label>
      <input type="text" id="full_name" required />

      <label class="required">Miestas</label>
      <input type="text" id="city" required />

      <label class="required">Telefonas</label>
      <input type="text" id="phone" required />

      <label class="required">Individualios veiklos nr.</label>
      <input type="text" id="iv_nr" required />

      <label>Aprašymas</label>
      <textarea id="description"></textarea>

      <button class="btn" type="submit">💾 Išsaugoti</button>
    </form>

    <p id="profileMsg"></p>
  </div>

</main>

<script>
  const supabaseUrl = "https://qnczakppadjxbicgjzcy.supabase.co";
  const supabaseKey =
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFuY3pha3BwYWRqeGJpY2dqemN5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjI5NTYxMjcsImV4cCI6MjA3ODUzMjEyN30.0lAl6L1GU1_uWpULlraaKM0KIfy3lCNSI_wp2X5zDmY";

  const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

  // AUTH CHECK
  async function checkAuth() {
    const { data } = await supabaseClient.auth.getUser();

    if (!data.user) {
      location.href = "./auth.html";
      return;
    }

    if (data.user.user_metadata.role !== "worker") {
      location.href = "./darbdavys.html";
    }
  }
  checkAuth();

  // LOGOUT
  async function logout() {
    await supabaseClient.auth.signOut();
    location.href = "./auth.html";
  }

  // LOAD PROFILE
  async function loadProfile() {
    const { data, error } = await supabaseClient.auth.getUser();
    const user = data.user;

    const { data: profile } = await supabaseClient
      .from("profiles")
      .select("*")
      .eq("id", user.id)
      .single();

    if (profile) {
      full_name.value = profile.full_name || "";
      city.value = profile.city || "";
      phone.value = profile.phone || "";
      iv_nr.value = profile.iv_nr || "";
      description.value = profile.description || "";
    }
  }
  loadProfile();

  // SAVE PROFILE
  const profileForm = document.getElementById("profileForm");
  const profileMsg = document.getElementById("profileMsg");

  profileForm.addEventListener("submit", async (e) => {
    e.preventDefault();

    const { data } = await supabaseClient.auth.getUser();

    const updateData = {
      full_name: full_name.value,
      city: city.value,
      phone: phone.value,
      iv_nr: iv_nr.value,
      description: description.value,
    };

    const { error } = await supabaseClient
      .from("profiles")
      .update(updateData)
      .eq("id", data.user.id);

    if (error) {
      profileMsg.textContent = "Klaida: " + error.message;
      profileMsg.style.color = "red";
    } else {
      profileMsg.textContent = "✔️ Profilis išsaugotas!";
      profileMsg.style.color = "lightgreen";
    }
  });
</script>

</body>
</html>
