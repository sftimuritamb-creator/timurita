<!doctype html>
<html lang="lt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Darbdavio profilis – Timurita</title>

  <link rel="stylesheet" href="./style.css">
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#1a2a44">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.48.0/dist/umd/supabase.js"></script>

  <style>
    .required-label::after {
      content: " *";
      color: #ff6b6b;
      font-weight: bold;
    }
  </style>
</head>
<body>

<header class="app-header">
  <h2>Darbdavio profilis</h2>
  <button onclick="logout()" style="margin-left:auto;" class="btn small">Atsijungti</button>
</header>

<main class="container">

  <!-- PROFILIO BLOKAS -->
  <div class="card">
    <h3>Įmonės duomenys</h3>

    <form id="profileForm">

      <label class="required-label">Įmonės pavadinimas</label>
      <input type="text" id="companyName" required>

      <label class="required-label">Įmonės kodas</label>
      <input type="text" id="companyCode" required>

      <label class="required-label">Kontaktinis asmuo</label>
      <input type="text" id="contactPerson" required>

      <label class="required-label">Miestas</label>
      <input type="text" id="city" required>

      <label class="required-label">Telefonas</label>
      <input type="text" id="phone" required>

      <label class="required-label">El. paštas</label>
      <input type="email" id="email" required>

      <button class="btn" type="submit">💾 Išsaugoti</button>

    </form>
    <p id="profileMsg"></p>
  </div>

  <!-- NAUJAS DARBO PASIŪLYMAS -->
  <div class="card">
    <h3>Naujas darbo pasiūlymas</h3>

    <form id="offerForm">

      <label class="required-label">Pavadinimas</label>
      <input type="text" id="oTitle" required>

      <label class="required-label">Miestas</label>
      <input type="text" id="oCity" required>

      <label>Įmonė</label>
      <input type="text" id="oCompany">

      <label>Aprašymas</label>
      <textarea id="oDescription"></textarea>

      <label class="required-label">Atlygis (val. / ranka)</label>
      <input type="text" id="oSalary" required>

      <button class="btn" type="submit">📤 Patalpinti pasiūlymą</button>

    </form>

    <p id="offerMsg"></p>
  </div>

  <!-- JŪSŲ PASIŪLYMAI -->
  <div class="card">
    <h3>Jūsų paskelbti pasiūlymai</h3>
    <div id="myOffersList">Kraunama...</div>
  </div>

  <!-- KANDIDATAI -->
  <div class="card">
    <h3>Kandidatai</h3>
    <div id="candidatesList">Kraunama...</div>
  </div>

</main>

<script>
  // Supabase init
  const supabaseUrl = "https://qnczakppadjxbicgjzcy.supabase.co";
  const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFuY3pha3BwYWRqeGJpY2dqemN5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjI5NTYxMjcsImV4cCI6MjA3ODUzMjEyN30.0lAl6L1GU1_uWpULlraaKM0KIfy3lCNSI_wp2X5zDmY";
  const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

  // AUTH CHECK
  async function checkAuth() {
    const { data } = await supabaseClient.auth.getUser();
    if (!data.user) {
      location.href = "./auth.html";
      return;
    }
    if (data.user.user_metadata.role !== "employer") {
      location.href = "./darbuotojai.html";
    }
  }
  checkAuth();

  // ATSIJUNGIMAS
  async function logout() {
    await supabaseClient.auth.signOut();
    location.href = "./auth.html";
  }

  // IŠSAUGOTI PROFILĮ
  const profileForm = document.getElementById("profileForm");
  const profileMsg = document.getElementById("profileMsg");

  profileForm.addEventListener("submit", () => {
    // visi privalomi laukai jau turi "required"
    const profile = {
      companyName: companyName.value,
      companyCode: companyCode.value,
      contactPerson: contactPerson.value,
      city: city.value,
      phone: phone.value,
      email: email.value
    };

    localStorage.setItem("employer_profile", JSON.stringify(profile));
    profileMsg.textContent = "Išsaugota!";
    profileMsg.style.color = "lightgreen";
  });

  // UŽKRAUTI PROFILĮ
  const saved = localStorage.getItem("employer_profile");
  if (saved) {
    const p = JSON.parse(saved);
    companyName.value = p.companyName || "";
    companyCode.value = p.companyCode || "";
    contactPerson.value = p.contactPerson || "";
    city.value = p.city || "";
    phone.value = p.phone || "";
    email.value = p.email || "";
  }

  // NAUJO PASIŪLYMO ĮKĖLIMAS
  const offerForm = document.getElementById("offerForm");
  const offerMsg = document.getElementById("offerMsg");

  offerForm.addEventListener("submit", async (e) => {
    e.preventDefault();

    // Required laukai
    if (!oTitle.value || !oCity.value || !oSalary.value) {
      offerMsg.textContent = "Prašome užpildyti privalomus laukus!";
      offerMsg.style.color = "red";
      return;
    }

    const { data } = await supabaseClient.auth.getUser();
    const user = data.user;

    const offer = {
      title: oTitle.value,
      city: oCity.value,
      company: oCompany.value,
      description: oDescription.value,
      salary: oSalary.value,
      owner_id: user.id,
      contact: "",
      phone: "",
      email: ""
    };

    // Įrašyti į Supabase
    const { error } = await supabaseClient.from("offers").insert(offer);

    if (error) {
      offerMsg.textContent = "Klaida saugant: " + error.message;
      offerMsg.style.color = "red";
    } else {
      offerMsg.textContent = "Pasiūlymas išsaugotas!";
      offerMsg.style.color = "lightgreen";
      loadMyOffers();
    }
  });

  // MANO PASIŪLYMAI
  async function loadMyOffers() {
    const { data } = await supabaseClient.auth.getUser();

    const userId = data.user.id;
    const { data: offers } = await supabaseClient
      .from("offers")
      .select("*")
      .eq("owner_id", userId)
      .order("created_at", { ascending: false });

    const list = document.getElementById("myOffersList");
    list.innerHTML = "";

    if (!offers || offers.length === 0) {
      list.textContent = "Dar nepaskelbėte jokių darbo pasiūlymų.";
      return;
    }

    offers.forEach(o => {
      const div = document.createElement("div");
      div.className = "card small";
      div.innerHTML = `
        <strong>${o.title}</strong><br>
        ${o.city}<br>
        Atlygis: ${o.salary}<br>
        <button class="btn small" onclick="deleteOffer('${o.id}')">🗑 Ištrinti</button>
      `;
      list.appendChild(div);
    });
  }

  async function deleteOffer(id) {
    await supabaseClient.from("offers").delete().eq("id", id);
    loadMyOffers();
  }

  loadMyOffers();

  // KANDIDATAI
  async function loadCandidates() {
    const { data } = await supabaseClient.auth.getUser();
    const userId = data.user.id;

    const { data: offers } = await supabaseClient.from("offers")
      .select("id,title")
      .eq("owner_id", userId);

    if (!offers || offers.length === 0) {
      candidatesList.textContent = "Nėra paskelbtų pasiūlymų.";
      return;
    }

    const offerIds = offers.map(o => o.id);

    const { data: applications } = await supabaseClient
      .from("applications")
      .select("*, profiles:worker_id (full_name,city,phone,email)");

    const list = document.getElementById("candidatesList");
    list.innerHTML = "";

    const filtered = applications.filter(a => offerIds.includes(a.offer_id));

    if (filtered.length === 0) {
      list.textContent = "Į jūsų darbo pasiūlymus dar niekas nekandidatavo.";
      return;
    }

    filtered.forEach(app => {
      const offer = offers.find(o => o.id === app.offer_id);
      const p = app.profiles;

      const card = document.createElement("div");
      card.className = "card small";
      card.innerHTML = `
        <strong>${p.full_name}</strong><br>
        Miestas: ${p.city}<br>
        Telefonas: ${p.phone}<br>
        El. paštas: <a href="mailto:${p.email}">${p.email}</a><br>
        <hr>
        Kandidatavo į: <strong>${offer.title}</strong>
      `;
      list.appendChild(card);
    });
  }

  loadCandidates();

</script>

</body>
</html>
