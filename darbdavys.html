<!doctype html>
<html lang="lt">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Darbdavio profilis – Timurita</title>

  <link rel="stylesheet" href="./style.css">
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#1a2a44">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.48.0/dist/umd/supabase.js"></script>

  <style>
    label {
      display:block;
      margin:8px 0 4px;
      font-weight:600;
      font-size:14px;
    }
    input, textarea, select {
      width:100%;
      padding:8px;
      border-radius:8px;
      border:1px solid #1e293b;
      background:#0f172a;
      color:#e2e8f0;
      margin-bottom:10px;
      font-size:14px;
    }
    textarea { min-height:70px; resize:vertical; }
    .required::after {
      content:" *";
      color:#ef4444;
      font-weight:bold;
    }
    .btn.small { padding:5px 10px; font-size:13px; }
    .offer-box, .candidate-box {
      background:#1e293b;
      padding:10px;
      border-radius:10px;
      margin-bottom:10px;
    }
    .toast {
      position:fixed;
      left:50%;
      bottom:20px;
      transform:translateX(-50%);
      background:#0f172a;
      color:#e5e7eb;
      padding:10px 14px;
      border-radius:999px;
      border:1px solid #22c55e;
      box-shadow:0 10px 25px rgba(0,0,0,0.5);
      font-size:13px;
      display:none;
      z-index:9999;
    }
  </style>
</head>
<body>

<header class="app-header">
  <h2>Darbdavio profilis</h2>
  <button onclick="logout()" class="btn small" style="margin-left:auto;">Atsijungti</button>
</header>

<main class="container">

  <!-- PROFILIS -->
  <div class="card">
    <h3>Įmonės duomenys</h3>

    <form id="profileForm">

      <label class="required">Įmonės pavadinimas</label>
      <input type="text" id="companyName" required>

      <label class="required">Įmonės kodas</label>
      <input type="text" id="companyCode" required>

      <label class="required">Kontaktinis asmuo</label>
      <input type="text" id="contactPerson" required>

      <label class="required">Miestas</label>
      <select id="city" required>
        <option value="Vilnius">Vilnius</option>
      </select>

      <label class="required">Telefonas</label>
      <input type="text" id="phone" required>

      <label class="required">El. paštas</label>
      <input type="email" id="email" required>

      <button class="btn" type="submit">💾 Išsaugoti</button>
    </form>

    <p id="profileMsg"></p>
  </div>

  <!-- NAUJAS PASIŪLYMAS -->
  <div class="card">
    <h3>Naujas darbo pasiūlymas</h3>

    <form id="offerForm">

      <label class="required">Pavadinimas</label>
      <input type="text" id="oTitle" required>

      <label class="required">Miestas</label>
      <select id="oCity" required>
        <option value="Vilnius">Vilnius</option>
      </select>

      <label class="required">Įmonės kodas</label>
      <input type="text" id="oCompanyCode" required>

      <label class="required">Įmonės pavadinimas</label>
      <input type="text" id="oCompany" required>

      <label>Aprašymas</label>
      <textarea id="oDescription"></textarea>

      <button class="btn" type="submit">📤 Patalpinti pasiūlymą</button>

    </form>

    <p id="offerMsg"></p>
  </div>

  <!-- MANO PASIŪLYMAI -->
  <div class="card">
    <h3>Jūsų paskelbti pasiūlymai</h3>
    <div id="myOffersList">Kraunama...</div>
  </div>

  <!-- KANDIDATAI -->
  <div class="card">
    <h3>Kandidatai</h3>
    <div id="candidatesList">Kraunama...</div>
  </div>

</main>

<div id="toast" class="toast"></div>

<script>
  const supabaseUrl = "https://qnczakppadjxbicgjzcy.supabase.co";
  const supabaseKey =
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFuY3pha3BwYWRqeGJpY2dqemN5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjI5NTYxMjcsImV4cCI6MjA3ODUzMjEyN30.0lAl6L1GU1_uWpULlraaKM0KIfy3lCNSI_wp2X5zDmY";

  const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

  const toastEl = document.getElementById("toast");
  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.style.display = "block";
    setTimeout(() => { toastEl.style.display = "none"; }, 4000);
  }

  async function checkAuth() {
    const { data } = await supabaseClient.auth.getUser();
    if (!data.user) {
      location.href = "./auth.html";
      return;
    }
    if (data.user.user_metadata.role !== "employer") {
      location.href = "./darbuotojai.html";
    }
  }
  checkAuth();

  async function logout() {
    await supabaseClient.auth.signOut();
    location.href = "./auth.html";
  }

  // PROFILIS
  const profileForm = document.getElementById("profileForm");
  const profileMsg = document.getElementById("profileMsg");

  profileForm.addEventListener("submit", () => {
    const profile = {
      companyName: companyName.value,
      companyCode: companyCode.value,
      contactPerson: contactPerson.value,
      city: city.value,
      phone: phone.value,
      email: email.value
    };

    localStorage.setItem("employer_profile", JSON.stringify(profile));
    profileMsg.style.color = "lightgreen";
    profileMsg.textContent = "✔️ Profilis išsaugotas!";
  });

  const saved = localStorage.getItem("employer_profile");
  if (saved) {
    const p = JSON.parse(saved);
    companyName.value = p.companyName || "";
    companyCode.value = p.companyCode || "";
    contactPerson.value = p.contactPerson || "";
    city.value = p.city || "Vilnius";
    phone.value = p.phone || "";
    email.value = p.email || "";
  }

  // NAUJAS PASIŪLYMAS
  const offerForm = document.getElementById("offerForm");
  const offerMsg = document.getElementById("offerMsg");

  offerForm.addEventListener("submit", async (e) => {
    e.preventDefault();

    if (!oTitle.value || !oCity.value || !oCompanyCode.value || !oCompany.value) {
      offerMsg.style.color = "red";
      offerMsg.textContent = "⚠️ Užpildykite visus privalomus laukus.";
      return;
    }

    const { data } = await supabaseClient.auth.getUser();
    const user = data.user;

    const offer = {
      title: oTitle.value,
      city: oCity.value,
      company_code: oCompanyCode.value,
      company: oCompany.value,
      description: oDescription.value,
      owner_id: user.id
    };

    const { error } = await supabaseClient.from("offers").insert(offer);

    if (error) {
      offerMsg.style.color = "red";
      offerMsg.textContent = "Klaida: " + error.message;
    } else {
      offerMsg.style.color = "lightgreen";
      offerMsg.textContent = "✔️ Pasiūlymas paskelbtas!";
      loadMyOffers();
    }
  });

  // MANO PASIŪLYMAI
  async function loadMyOffers() {
    const { data } = await supabaseClient.auth.getUser();
    const userId = data.user.id;

    const { data: offers } = await supabaseClient
      .from("offers")
      .select("*")
      .eq("owner_id", userId)
      .order("created_at", { ascending: false });

    const list = document.getElementById("myOffersList");
    list.innerHTML = "";

    if (!offers || offers.length === 0) {
      list.textContent = "Dar nepaskelbėte pasiūlymų.";
      return;
    }

    offers.forEach(o => {
      const div = document.createElement("div");
      div.className = "offer-box";
      div.innerHTML = `
        <strong>${o.title}</strong><br>
        ${o.city}<br>
        Įmonės kodas: ${o.company_code}<br>
        <button class="btn small" onclick="deleteOffer('${o.id}')">🗑 Ištrinti</button>
      `;
      list.appendChild(div);
    });

    window.__myOffers = offers || [];
  }
  loadMyOffers();

  async function deleteOffer(id) {
    await supabaseClient.from("offers").delete().eq("id", id);
    loadMyOffers();
  }

  // KANDIDATAI
  async function loadCandidates() {
    const { data } = await supabaseClient.auth.getUser();
    const userId = data.user.id;

    const { data: offers } = await supabaseClient
      .from("offers")
      .select("id,title")
      .eq("owner_id", userId);

    const list = document.getElementById("candidatesList");

    if (!offers || offers.length === 0) {
      list.textContent = "Neturite paskelbtų pasiūlymų.";
      return;
    }

    const offerIds = offers.map(o => o.id);

    const { data: applications } = await supabaseClient
      .from("applications")
      .select("*, profiles:worker_id (full_name,city,phone,email)");

    list.innerHTML = "";

    const filtered = applications.filter(a => offerIds.includes(a.offer_id));

    if (filtered.length === 0) {
      list.textContent = "Kandidatų dar nėra.";
      return;
    }

    filtered.forEach(app => {
      const offer = offers.find(o => o.id === app.offer_id);
      const p = app.profiles;

      const div = document.createElement("div");
      div.className = "candidate-box";
      div.innerHTML = `
        <strong>${p.full_name}</strong><br>
        Miestas: ${p.city}<br>
        Tel.: ${p.phone}<br>
        El. paštas: <a href="mailto:${p.email}">${p.email}</a><br>
        <hr>
        Kandidatavo į: <strong>${offer.title}</strong>
      `;
      list.appendChild(div);
    });

    window.__myOffers = offers || [];
  }
  loadCandidates();

  // 🔔 Realtime kandidatams
  const candidatesChannel = supabaseClient
    .channel("public:applications")
    .on(
      "postgres_changes",
      { event: "INSERT", schema: "public", table: "applications" },
      async (payload) => {
        const app = payload.new;

        await loadCandidates();

        const offers = window.__myOffers || [];
        const found = offers.find(o => o.id === app.offer_id);
        const title = found ? found.title : "jūsų pasiūlymą";

        showToast("✅ Naujas kandidatas į: " + title);
      }
    )
    .subscribe();
</script>

</body>
</html>
