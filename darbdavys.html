<!doctype html>
<html lang="lt">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Darbdavio valdymas – Timurita</title>

  <link rel="stylesheet" href="./style.css">
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#1a2a44">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.48.0/dist/umd/supabase.js"></script>

  <style>
    label {
      display:block;
      margin:8px 0 4px;
      font-weight:600;
      font-size:14px;
    }
    input, textarea, select {
      width:100%;
      padding:8px;
      border-radius:8px;
      border:1px solid #1e293b;
      background:#0f172a;
      color:#e2e8f0;
      margin-bottom:10px;
      font-size:14px;
    }
    textarea { min-height:80px; resize:vertical; }

    .required::after {
      content:" *";
      color:#ef4444;
      font-weight:bold;
    }

    .offer-card {
      background:#0b1220;
      border-radius:12px;
      border:1px solid #1f2937;
      padding:12px;
      margin-bottom:12px;
    }
    .offer-header {
      display:flex;
      justify-content:space-between;
      gap:8px;
      align-items:center;
    }
    .badge {
      display:inline-block;
      padding:2px 8px;
      border-radius:999px;
      font-size:11px;
    }
    .badge-pending {
      background:#1f2937;
      color:#fbbf24;
      border:1px solid #facc15;
    }
    .badge-approved {
      background:#022c22;
      color:#6ee7b7;
      border:1px solid #22c55e;
    }
    .badge-rejected {
      background:#3f1d1d;
      color:#fecaca;
      border:1px solid #ef4444;
    }

    .candidate {
      background:#020617;
      border-radius:8px;
      border:1px solid #1e293b;
      padding:8px;
      margin-top:6px;
      font-size:13px;
    }
    .candidate-status {
      font-size:11px;
      color:#e5e7eb;
      margin-top:4px;
    }
    .small-text {
      font-size:12px;
      color:#9ca3af;
    }
    .btn.small { padding:6px 10px; font-size:13px; }
  </style>
</head>
<body>

<header class="app-header">
  <h2>Darbdavio valdymas</h2>
  <button class="btn small" onclick="logout()" style="margin-left:auto;">Atsijungti</button>
</header>

<main class="container">

  <!-- Naujo pasiūlymo forma -->
  <div class="card">
    <h3>Sukurti naują darbo pasiūlymą</h3>
    <p class="small-text">
      Užpildykite formą. Pasiūlymas pirmiausia keliaus administratoriui, kuris jį patvirtins arba atmes.
    </p>

    <form id="offerForm">
      <!-- Pavadinimas: pasirinkimas iš 3 variantų -->
      <label class="required">Pavadinimas</label>
      <select id="title" required>
        <option value="">Pasirinkite...</option>
        <option value="Pagalbinis darbuotojas">Pagalbinis darbuotojas</option>
        <option value="Darbuotojas betonuotojas">Darbuotojas betonuotojas</option>
        <option value="Darbuotojas Valytoja/as">Darbuotojas Valytoja/as</option>
      </select>

      <!-- Miestas: tik Vilnius -->
      <label class="required">Miestas</label>
      <select id="city" required>
        <option value="Vilnius">Vilnius</option>
      </select>

      <!-- Įmonės pavadinimas: privalomas, automatiškai bandom užpildyti iš profilio -->
      <label class="required">Įmonės pavadinimas</label>
      <input type="text" id="company" required placeholder="Jūsų įmonė">

      <!-- Įmonės kodas: privalomas, automatiškai bandom užpildyti iš profilio -->
      <label class="required">Įmonės kodas</label>
      <input type="text" id="companyCode" required placeholder="Įmonės kodas">

      <!-- Atlygio lauką pašalinom -->

      <label>Aprašymas</label>
      <textarea id="description" placeholder="Trumpai aprašykite darbą, laiką, reikalavimus"></textarea>

      <!-- Kontaktas: visi privalomi -->
      <label class="required">Kontaktinis asmuo</label>
      <input type="text" id="contact" required placeholder="Vardas, pavardė">

      <label class="required">Telefonas</label>
      <input type="text" id="phone" required placeholder="Kontaktinis telefonas">

      <label class="required">El. paštas</label>
      <input type="email" id="email" required placeholder="Kontaktinis el. paštas">

      <button class="btn" type="submit">💾 Išsaugoti pasiūlymą</button>
    </form>

    <p id="offerMsg" class="small-text" style="margin-top:6px;"></p>
  </div>

  <!-- Darbdavio pasiūlymų sąrašas -->
  <div class="card">
    <h3>Mano darbo pasiūlymai ir kandidatai</h3>
    <div id="offersList">Kraunama...</div>
  </div>

</main>

<script>
  const supabaseClient = supabase.createClient(
    "https://qnczakppadjxbicgjzcy.supabase.co",
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFuY3pha3BwYWRqeGJpY2dqemN5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjI5NTYxMjcsImV4cCI6MjA3ODUzMjEyN30.0lAl6L1GU1_uWpULlraaKM0KIfy3lCNSI_wp2X5zDmY"
  );

  let currentUser = null;

  // 🔐 Tik darbdavys turi pasiekti šį puslapį
  async function checkEmployer() {
    const { data, error } = await supabaseClient.auth.getUser();
    if (error || !data.user) {
      location.href = "./auth.html";
      return;
    }

    currentUser = data.user;

    const role = currentUser.user_metadata?.role;
    if (role !== "employer") {
      alert("Šis puslapis prieinamas tik darbdaviams.");
      location.href = "./main.html";
      return;
    }

    // pabandom užpildyti formą iš darbdavio profilio
    await preloadEmployerProfile();
  }

  async function preloadEmployerProfile() {
    try {
      const { data: profile, error } = await supabaseClient
        .from("profiles")
        .select("*")
        .eq("id", currentUser.id)
        .maybeSingle();

      if (error) {
        console.log("Klaida skaitant darbdavio profilį:", error);
        return;
      }

      if (!profile) return;

      const companyInput     = document.getElementById("company");
      const companyCodeInput = document.getElementById("companyCode");
      const contactInput     = document.getElementById("contact");
      const phoneInput       = document.getElementById("phone");
      const emailInput       = document.getElementById("email");

      // Pirmiausia bandome imti iš specialių laukų, jei juos turėsi ateity
      if (profile.company && !companyInput.value) {
        companyInput.value = profile.company;
      }
      if (profile.company_code && !companyCodeInput.value) {
        companyCodeInput.value = profile.company_code;
      }

      // Jei nėra specialių laukų – naudojam fallback iš to, ką turim:
      // full_name kaip įmonės pavadinimą, iv_nr kaip įmonės kodą (jei naudojama tam)
      if (!companyInput.value && profile.full_name) {
        companyInput.value = profile.full_name;
      }
      if (!companyCodeInput.value && profile.iv_nr) {
        companyCodeInput.value = profile.iv_nr;
      }

      if (!contactInput.value && profile.full_name) {
        contactInput.value = profile.full_name;
      }
      if (!phoneInput.value && profile.phone) {
        phoneInput.value = profile.phone;
      }
      if (!emailInput.value && profile.email) {
        emailInput.value = profile.email;
      }

    } catch (e) {
      console.log("Klaida pre-load darbdavio profilio:", e);
    }
  }

  function statusBadge(status) {
    const s = (status || "").toLowerCase();
    if (s === "approved") {
      return '<span class="badge badge-approved">Patvirtintas</span>';
    }
    if (s === "rejected") {
      return '<span class="badge badge-rejected">Atmestas</span>';
    }
    return '<span class="badge badge-pending">Laukia patvirtinimo</span>';
  }

  // 💾 Naujo pasiūlymo išsaugojimas
  const offerForm = document.getElementById("offerForm");
  const offerMsg  = document.getElementById("offerMsg");

  offerForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    offerMsg.textContent = "";
    offerMsg.style.color = "#e5e7eb";

    if (!currentUser) {
      offerMsg.style.color = "#fecaca";
      offerMsg.textContent = "Nėra prisijungusio vartotojo.";
      return;
    }

    const title       = document.getElementById("title").value.trim();
    const city        = document.getElementById("city").value;
    const company     = document.getElementById("company").value.trim();
    const companyCode = document.getElementById("companyCode").value.trim();
    const description = document.getElementById("description").value.trim();
    const contact     = document.getElementById("contact").value.trim();
    const phone       = document.getElementById("phone").value.trim();
    const email       = document.getElementById("email").value.trim();

    if (!title || !city || !company || !companyCode || !contact || !phone || !email) {
      offerMsg.style.color = "#fecaca";
      offerMsg.textContent = "Užpildykite visus privalomus laukus.";
      return;
    }

    const payload = {
      owner_id: currentUser.id,
      title,
      city,
      company,
      company_code: companyCode,
      description: description || null,
      contact,
      phone,
      email,
      status: "pending"
    };

    const { error } = await supabaseClient
      .from("offers")
      .insert(payload);

    if (error) {
      offerMsg.style.color = "#fecaca";
      offerMsg.textContent = "Klaida išsaugant pasiūlymą: " + error.message;
      return;
    }

    offerMsg.style.color = "#a7f3d0";
    offerMsg.textContent = "✔️ Pasiūlymas išsaugotas. Jis lauks administratoriaus patvirtinimo.";

    offerForm.reset();
    document.getElementById("city").value = "Vilnius";

    loadOffers();
  });

  // 📥 Įkelti darbdavio pasiūlymus
  async function loadOffers() {
    const list = document.getElementById("offersList");
    list.textContent = "Kraunama...";

    if (!currentUser) return;

    const { data: offers, error } = await supabaseClient
      .from("offers")
      .select("*")
      .eq("owner_id", currentUser.id)
      .order("created_at", { ascending: false });

    if (error) {
      list.textContent = "Klaida kraunant pasiūlymus.";
      return;
    }

    if (!offers || offers.length === 0) {
      list.innerHTML = "<p>Dar neturite jokių pasiūlymų.</p>";
      return;
    }

    list.innerHTML = "";
    for (const o of offers) {
      const card = document.createElement("div");
      card.className = "offer-card";

      card.innerHTML = `
        <div class="offer-header">
          <div>
            <strong>${o.title}</strong><br>
            <span class="small-text">${o.company || ""} • ${o.city || ""}</span>
          </div>
          <div>${statusBadge(o.status)}</div>
        </div>

        <div class="small-text" style="margin-top:6px;">
          <strong>Įmonės kodas:</strong> ${o.company_code || "-"}
        </div>

        <div class="small-text" style="margin-top:6px;">
          ${o.description || ""}
        </div>

        <div class="small-text" style="margin-top:8px;">
          <strong>Kontaktai:</strong> ${o.contact || ""} • ${o.phone || ""} • ${o.email || ""}
        </div>

        <div style="margin-top:10px;">
          <strong>Kandidatai:</strong>
          <div id="candidates-${o.id}" class="small-text">Kraunama...</div>
        </div>
      `;

      list.appendChild(card);

      // užkraunam kandidatus šiam pasiūlymui
      loadCandidatesForOffer(o.id);
    }
  }

  // 👥 Įkelti kandidatus konkrečiam pasiūlymui
  async function loadCandidatesForOffer(offerId) {
    const box = document.getElementById(`candidates-${offerId}`);
    if (!box) return;

    const { data: apps, error } = await supabaseClient
      .from("applications")
      .select("id, worker_id, status")
      .eq("offer_id", offerId);

    if (error) {
      box.textContent = "Klaida kraunant kandidatus.";
      return;
    }

    if (!apps || apps.length === 0) {
      box.textContent = "Kandidatų nėra.";
      return;
    }

    box.innerHTML = "";
    for (const app of apps) {
      // nuskaitom darbuotojo profilį
      const { data: profile, error: profErr } = await supabaseClient
        .from("profiles")
        .select("full_name, city, phone, email, iv_nr")
        .eq("id", app.worker_id)
        .maybeSingle();

      if (profErr) {
        const div = document.createElement("div");
        div.className = "candidate";
        div.textContent = "Klaida skaitant kandidato duomenis.";
        box.appendChild(div);
        continue;
      }

      const div = document.createElement("div");
      div.className = "candidate";

      const appStatus = (app.status || "pending").toLowerCase();

      div.innerHTML = `
        <div><strong>${profile?.full_name || "Be vardo"}</strong> (${profile?.city || "-"})</div>
        <div>Tel.: ${profile?.phone || "-"}</div>
        <div>El. paštas: ${profile?.email || "-"}</div>
        <div>IV nr.: ${profile?.iv_nr || "-"}</div>
        <div class="candidate-status"><strong>Statusas:</strong> ${appStatus}</div>
      `;

      box.appendChild(div);
    }
  }

  async function logout() {
    await supabaseClient.auth.signOut();
    location.href = "./auth.html";
  }

  (async () => {
    await checkEmployer();
    await loadOffers();
  })();

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register("./service-worker.js")
      .catch(e => console.log("SW error darbdavys.html", e));
  }
</script>

</body>
</html>
