<!doctype html>
<html lang="lt">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Timurita – Prisijungimas</title>
  <meta name="description" content="Prisijunkite arba užsiregistruokite naudotis Timurita platforma.">

  <link rel="manifest" href="/timurita/manifest.json">
  <meta name="theme-color" content="#1a2a44">
  <link rel="icon" href="/timurita/Timurita_logo_192x192.png" type="image/png">

  <link rel="stylesheet" href="/timurita/style.css">

  <style>
    :root{ --bg:#0f172a; --card:#020617; --fg:#e5e7eb; --muted:#94a3b8; --accent:#0ea5e9; --line:#1e293b;}
    body { margin:0; font-family:system-ui,-apple-system,segoe ui,roboto,sans-serif; background:radial-gradient(circle at top,#1e293b,#020617); color:var(--fg); min-height:100vh; display:flex; flex-direction:column; }
    .app-header { display:flex; align-items:center; justify-content:center; padding:16px; }
    .app-header a { display:flex; align-items:center; gap:10px; text-decoration:none; color:inherit; }
    .app-header img { width:40px; height:40px; border-radius:12px; }
    .app-header h1 { margin:0; font-size:20px; }
    .app-header .subtitle { font-size:12px; color:var(--muted); }

    .auth-wrapper { flex:1; display:flex; justify-content:center; align-items:center; padding:16px; }
    .card { background:rgba(15,23,42,0.96); border-radius:18px; border:1px solid rgba(148,163,184,0.3); max-width:420px; width:100%; padding:20px 18px 18px; box-shadow:0 20px 40px rgba(15,23,42,0.8); }
    .tabs { display:flex; border-radius:999px; background:#020617; padding:3px; margin-bottom:16px; }
    .tab-btn { flex:1; border-radius:999px; border:none; background:transparent; color:var(--muted); font-size:13px; font-weight:600; padding:7px 10px; cursor:pointer; }
    .tab-btn.active { background:var(--accent); color:#0b1120; }

    label { display:block; margin-top:10px; font-size:13px; font-weight:600; color:#e2e8f0; }
    input[type="email"],
    input[type="password"]{
      width:100%; margin-top:4px; padding:9px 10px; border-radius:10px;
      border:1px solid #1e293b; background:#020617; color:var(--fg); font-size:14px;
    }
    input::placeholder { color:#64748b; }

    .role-row { display:flex; gap:10px; margin-top:6px; }
    .role-option { flex:1; border-radius:12px; border:1px solid #1e293b; background:#020617; padding:8px 10px; cursor:pointer; display:flex; align-items:center; gap:8px; font-size:13px; color:var(--muted); }
    .role-option input { margin:0; }
    .role-option.active { border-color:var(--accent); color:#e5e7eb; }

    .btn { width:100%; margin-top:12px; padding:9px 12px; border-radius:12px; border:none; cursor:pointer; font-weight:600; font-size:14px; display:inline-flex; align-items:center; justify-content:center; gap:6px; }
    .btn.primary { background:var(--accent); color:#0b1120; }
    .btn.secondary-link { background:transparent; color:var(--muted); border:none; font-size:12px; text-decoration:underline; justify-content:flex-start; padding-left:0; }
    .btn:disabled { opacity:0.6; cursor:default; }

    .hint { margin-top:8px; font-size:12px; color:var(--muted); }
    .hint strong { color:#e5e7eb; }

    .msg { margin-top:8px; font-size:12px; min-height:16px; }
    .msg.ok { color:#a7f3d0; }
    .msg.err { color:#fecaca; }

    .foot { margin-top:10px; font-size:11px; color:#64748b; text-align:center; }
    .foot a { color:#38bdf8; text-decoration:none; }

    /* Reset slaptažodžio forma */
    #resetForm { margin-top:4px; }
    #resetFormTitle { font-size:15px; font-weight:600; margin-bottom:4px; }
    #resetHint { font-size:12px; color:var(--muted); margin-bottom:10px; }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.48.0/dist/umd/supabase.js"></script>
</head>
<body>
  <header class="app-header">
    <a href="/timurita/index.html">
      <img src="/timurita/Timurita_logo_192x192.png" alt="Timurita">
      <div>
        <h1>Timurita</h1>
        <div class="subtitle">Trumpalaikio darbo platforma statybose</div>
      </div>
    </a>
  </header>

  <main class="auth-wrapper">
    <section class="card">
      <div class="tabs" id="tabsBar">
        <button class="tab-btn active" id="tabLogin" type="button">Prisijungti</button>
        <button class="tab-btn" id="tabRegister" type="button">Registruotis</button>
      </div>

      <!-- Prisijungimo forma -->
      <form id="loginForm">
        <label>El. paštas
          <input type="email" name="email" placeholder="el.pastas@pavyzdys.lt" required autocomplete="email">
        </label>
        <label>Slaptažodis
          <input type="password" name="password" placeholder="••••••••" required autocomplete="current-password">
        </label>

        <button class="btn primary" type="submit">Prisijungti</button>
        <button class="btn secondary-link" type="button" id="forgotBtn">Pamiršau slaptažodį</button>

        <div id="loginMsg" class="msg"></div>
      </form>

      <!-- Registracijos forma -->
      <form id="registerForm" style="display:none;">
        <label>El. paštas
          <input type="email" name="email" placeholder="el.pastas@pavyzdys.lt" required autocomplete="email">
        </label>
        <label>Slaptažodis
          <input type="password" name="password" placeholder="Mažiausiai 6 simboliai" required autocomplete="new-password" minlength="6">
        </label>

        <label>Rolė sistemoje</label>
        <div class="role-row">
          <label class="role-option active" id="roleWorkerBox">
            <input type="radio" name="role" value="worker" checked>
            👷‍♂️ <div><div>Darbuotojas</div><div style="font-size:11px;color:#64748b;">Ieškau darbo, noriu kandidatuoti</div></div>
          </label>
          <label class="role-option" id="roleEmployerBox">
            <input type="radio" name="role" value="employer">
            🧱 <div><div>Darbdavys</div><div style="font-size:11px;color:#64748b;">Skelbsiu darbo pasiūlymus</div></div>
          </label>
        </div>

        <button class="btn primary" type="submit">Registruotis</button>
        <div id="registerMsg" class="msg"></div>
      </form>

      <!-- Reset slaptažodžiui -->
      <div id="resetBox" style="display:none;">
        <div id="resetFormTitle">Nustatyti naują slaptažodį</div>
        <div id="resetHint">Įveskite naują slaptažodį savo paskyrai.</div>

        <form id="resetForm">
          <label>Naujas slaptažodis
            <input type="password" name="password1" required minlength="6">
          </label>
          <label>Pakartoti slaptažodį
            <input type="password" name="password2" required minlength="6">
          </label>
          <button class="btn primary" type="submit">Atnaujinti slaptažodį</button>
          <div id="resetMsg" class="msg"></div>
        </form>
      </div>

      <p class="foot">
        Prisijungęs vartotojas bus nukreiptas pagal rolę:<br>
        Darbdavys → <strong>darbdavys.html</strong>, Darbuotojas → <strong>darbuotojai.html</strong>
      </p>
    </section>
  </main>

  <script>
    let supabaseClient = null;
    try {
      const url='https://qnczakppadjxbicgjzcy.supabase.co';
      const key='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFuY3pha3BwYWRqeGJpY2dqemN5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjI5NTYxMjcsImV4cCI6MjA3ODUzMjEyN30.0lAl6L1GU1_uWpULlraaKM0KIfy3lCNSI_wp2X5zDmY';
      supabaseClient = supabase.createClient(url,key);
    } catch(e){ console.error(e); }

    const loginForm = document.getElementById('loginForm');
    const registerForm = document.getElementById('registerForm');
    const resetBox = document.getElementById('resetBox');
    const resetForm = document.getElementById('resetForm');
    const loginMsg = document.getElementById('loginMsg');
    const registerMsg = document.getElementById('registerMsg');
    const resetMsg = document.getElementById('resetMsg');
    const forgotBtn = document.getElementById('forgotBtn');
    const tabsBar = document.getElementById('tabsBar');

    function saveRoleLocally(role){
      localStorage.setItem("timurita_role",role);
    }
    function redirectByRole(role){
      if(role==="employer") location.href="/timurita/darbdavys.html";
      else location.href="/timurita/darbuotojai.html";
    }

    // TAB switching
    document.getElementById('tabLogin').onclick=()=>{ 
      loginForm.style.display=""; 
      registerForm.style.display="none"; 
    };
    document.getElementById('tabRegister').onclick=()=>{ 
      loginForm.style.display="none"; 
      registerForm.style.display=""; 
    };

    // Login
    loginForm.onsubmit=async(e)=>{
      e.preventDefault();
      loginMsg.textContent="";
      const email=loginForm.email.value;
      const password=loginForm.password.value;

      const {data,error}=await supabaseClient.auth.signInWithPassword({email,password});
      if(error){ loginMsg.textContent=error.message; loginMsg.className="msg err"; return; }

      const role=data.user.user_metadata.role || "worker";
      saveRoleLocally(role);
      loginMsg.textContent="Prisijungta. Nukreipiama...";
      loginMsg.className="msg ok";
      setTimeout(()=>redirectByRole(role),700);
    };

    // Register
    registerForm.onsubmit=async(e)=>{
      e.preventDefault();
      registerMsg.textContent="";
      const email=registerForm.email.value;
      const password=registerForm.password.value;
      const role=registerForm.role.value;

      const {data,error}=await supabaseClient.auth.signUp({
        email,password,
        options:{data:{role}}
      });
      if(error){ registerMsg.textContent=error.message; registerMsg.className="msg err"; return; }

      registerMsg.textContent="Registracija sėkminga. Patvirtinkite el. paštą.";
      registerMsg.className="msg ok";
      loginForm.email.value=email;
      loginForm.style.display="";
      registerForm.style.display="none";
    };

    // Forgot password
    forgotBtn.onclick=async()=>{
      const email=loginForm.email.value;
      if(!email){ loginMsg.textContent="Įveskite el. paštą"; return; }

      const {error}=await supabaseClient.auth.resetPasswordForEmail(email,{
        redirectTo:"https://sftimuritamb-creator.github.io/timurita/auth.html"
      });
      if(error){ loginMsg.textContent=error.message; loginMsg.className="msg err"; return; }

      loginMsg.textContent="Reset nuoroda išsiųsta į el. paštą";
      loginMsg.className="msg ok";
    };

    // Password reset from email
    async function handleRecovery(){
      tabsBar.style.display="none";
      loginForm.style.display="none";
      registerForm.style.display="none";
      resetBox.style.display="";

      const {data,error}=await supabaseClient.auth.getUser();
      if(error || !data.user){
        resetMsg.textContent="Nuoroda negalioja.";
        resetMsg.className="msg err";
        return;
      }
      resetMsg.textContent="Įveskite naują slaptažodį.";
      resetMsg.className="msg ok";
    }

    // Submit reset
    resetForm.onsubmit=async(e)=>{
      e.preventDefault();
      const p1=resetForm.password1.value;
      const p2=resetForm.password2.value;
      if(p1!==p2){ resetMsg.textContent="Nesutampa"; resetMsg.className="msg err"; return; }

      const {error}=await supabaseClient.auth.updateUser({password:p1});
      if(error){ resetMsg.textContent=error.message; resetMsg.className="msg err"; return; }

      resetMsg.textContent="Slaptažodis atnaujintas!";
      resetMsg.className="msg ok";
      setTimeout(()=>location.href="/timurita/auth.html",1200);
    };

    // Signup confirm (email verification)
    async function handleSignupConfirm(){
      loginForm.style.display="";
      registerForm.style.display="none";

      const {data,error}=await supabaseClient.auth.getUser();
      if(error || !data.user){
        loginMsg.textContent="Patvirtinimo nuoroda jau panaudota.";
        loginMsg.className="msg err";
        return;
      }

      const role=data.user.user_metadata.role || "worker";
      saveRoleLocally(role);

      loginMsg.textContent="El. paštas patvirtintas! Nukreipiama...";
      loginMsg.className="msg ok";

      setTimeout(()=>redirectByRole(role),1200);
    }

    // Check URL hash for special modes
    document.addEventListener("DOMContentLoaded", async ()=>{
      const h=location.hash;

      if(h.includes("type=recovery")) return handleRecovery();
      if(h.includes("type=signup")) return handleSignupConfirm();

      const {data}=await supabaseClient.auth.getUser();
      if(data.user){
        const role=data.user.user_metadata.role || "worker";
        saveRoleLocally(role);
        redirectByRole(role);
      }
    });

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/timurita/service-worker.js');
    }
  </script>
</body>
</html>
