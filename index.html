<!doctype html>
<html lang="lt">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Timurita</title>
  <meta name="description" content="Trumpalaikio darbo platforma statybų sektoriuje." />
  <link rel="manifest" href="/timurita/manifest.json">
  <meta name="theme-color" content="#1a2a44">
  <link rel="icon" href="/timurita/Timurita_logo_192x192.png" type="image/png">
  <link rel="stylesheet" href="/timurita/style.css">

  <style>
    :root{ --bg:#0f172a; --card:#020617; --fg:#e5e7eb; --muted:#94a3b8;}
    body { margin:0; font-family:system-ui,-apple-system,segoe ui,roboto,sans-serif; background:radial-gradient(circle at top,#1e293b,#020617); color:var(--fg); min-height:100vh; display:flex; flex-direction:column; }
    .app-header { display:flex; align-items:center; justify-content:center; padding:16px; }
    .app-header a { display:flex; align-items:center; gap:10px; text-decoration:none; color:inherit; }
    .app-header img { width:40px; height:40px; border-radius:12px; }
    .app-header h1 { margin:0; font-size:20px; }
    .app-header .subtitle { font-size:12px; color:var(--muted); }
    .main-wrap { flex:1; display:flex; justify-content:center; align-items:center; padding:16px; }
    .card { background:rgba(15,23,42,0.96); border-radius:18px; border:1px solid rgba(148,163,184,0.3); max-width:420px; width:100%; padding:20px 18px 18px; box-shadow:0 20px 40px rgba(15,23,42,0.8); text-align:center; }
    .card h2 { margin:0 0 6px; }
    .card p { margin:0; font-size:13px; color:var(--muted); }
  </style>
</head>
<body>
  <header class="app-header">
    <a href="/timurita/index.html">
      <img src="/timurita/Timurita_logo_192x192.png" alt="Timurita">
      <div>
        <h1>Timurita</h1>
        <div class="subtitle">Sujungiame darbdavius ir statybų specialistus</div>
      </div>
    </a>
  </header>

  <main class="main-wrap">
    <section class="card">
      <h2>Kraunama...</h2>
      <p>Jus netrukus nukreipsime į prisijungimo langą.</p>
    </section>
  </main>

  <script>
    // Tiesiog nukreipiam į prisijungimo/registracijos puslapį.
    document.addEventListener('DOMContentLoaded', () => {
      window.location.href = '/timurita/auth.html';
    });

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/timurita/service-worker.js')
        .then(()=>console.log('SW registered (index.html)'))
        .catch(e=>console.log('SW error', e));
    }
  </script>
</body>
</html>
