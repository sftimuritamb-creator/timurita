<!doctype html>
<html lang="lt">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Darbo pasiūlymai – Timurita</title>

  <link rel="stylesheet" href="./style.css">
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#1a2a44">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.48.0/dist/umd/supabase.js"></script>

  <style>
    .job-card {
      background:#1e293b;
      border:1px solid #334155;
      padding:14px;
      border-radius:12px;
      margin-bottom:12px;
    }
    .btn.small {
      padding:6px 10px;
      font-size:13px;
    }
  </style>
</head>
<body>

<header class="app-header">
  <h2>Darbo pasiūlymai</h2>
  <button onclick="logout()" class="btn small" style="margin-left:auto;">Atsijungti</button>
</header>

<main class="container">

  <div class="card">
    <h3>Visi patvirtinti pasiūlymai</h3>
    <p>Galite kandidatuoti tik tada, jei administratorius patvirtino jūsų paskyrą.</p>

    <div id="jobsList">Kraunama...</div>
  </div>

</main>

<script>
  const supabaseClient = supabase.createClient(
    "https://qnczakppadjxbicgjzcy.supabase.co",
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFuY3pha3BwYWRqeGJpY2dqemN5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjI5NTYxMjcsImV4cCI6MjA3ODUzMjEyN30.0lAl6L1GU1_uWpULlraaKM0KIfy3lCNSI_wp2X5zDmY"
  );

  let currentUser = null;
  let currentProfile = null;

  // 1️⃣ Užkraunam prisijungusį vartotoją ir jo profilį (jei worker)
  async function loadUser() {
    const { data, error } = await supabaseClient.auth.getUser();

    if (error || !data.user) {
      location.href = "./auth.html";
      return;
    }

    currentUser = data.user;
    const role = currentUser.user_metadata?.role;

    if (role === "worker") {
      const { data: profile, error: profErr } = await supabaseClient
        .from("profiles")
        .select("*")
        .eq("id", currentUser.id)
        .maybeSingle();

      if (profErr) {
        console.log("Klaida kraunant profilį:", profErr);
        currentProfile = null;
      } else {
        currentProfile = profile || null;
      }
    } else {
      currentProfile = null;
    }
  }

  // 2️⃣ Įkeliam visus patvirtintus pasiūlymus (status = approved)
  async function loadJobs() {
    const box = document.getElementById("jobsList");

    const { data: offers, error } = await supabaseClient
      .from("offers")
      .select("*")
      .eq("status", "approved")
      .order("created_at", { ascending: false });

    if (error) {
      console.log("Klaida kraunant pasiūlymus:", error);
      box.innerHTML = `<p>Klaida kraunant pasiūlymus.</p>`;
      return;
    }

    if (!offers || offers.length === 0) {
      box.innerHTML = `<p>Nėra patvirtintų pasiūlymų.</p>`;
      return;
    }

    box.innerHTML = "";
    offers.forEach(o => {
      const div = document.createElement("div");
      div.className = "job-card";

      div.innerHTML = `
        <h3>${o.title}</h3>
        <div><strong>Įmonė:</strong> ${o.company || "-"}</div>
        <div><strong>Įmonės kodas:</strong> ${o.company_code || "-"}</div>
        <div><strong>Miestas:</strong> ${o.city || "-"}</div>
        <p style="margin-top:10px;">${o.description || ""}</p>
        <br>
        <div id="btn-${o.id}"></div>
      `;

      box.appendChild(div);

      renderApplyButton(o.id);
    });
  }

  // 3️⃣ Parodom / paslepiam „Kandidatuoti“ mygtuką pagal role ir is_approved
  function renderApplyButton(offerId) {
    const area = document.getElementById(`btn-${offerId}`);
    if (!currentUser) {
      area.innerHTML = "";
      return;
    }

    const role = currentUser.user_metadata?.role;

    // Tik darbuotojai gali kandidatuoti
    if (role !== "worker") {
      area.innerHTML = `<p style="font-size:12px;color:#9ca3af;">Prisijunkite kaip darbuotojas, kad galėtumėte kandidatuoti.</p>`;
      return;
    }

    // Jei profilis neįrašytas arba nepatvirtintas
    if (!currentProfile || !currentProfile.is_approved) {
      area.innerHTML = `<p style="color:#fbbf24;font-size:12px;">Jūsų paskyra dar nepatvirtinta – negalite kandidatuoti.</p>`;
      return;
    }

    // Viskas gerai – rodom mygtuką
    area.innerHTML = `
      <button class="btn small" onclick="apply('${offerId}')">Kandidatuoti</button>
    `;
  }

  // 4️⃣ Kandidatavimo funkcija – rašom į applications su status: "pending"
  async function apply(offerId) {
    if (!currentUser) {
      alert("Pirmiausia prisijunkite.");
      return;
    }

    const role = currentUser.user_metadata?.role;
    if (role !== "worker") {
      alert("Tik darbuotojai gali kandidatuoti.");
      return;
    }

    if (!currentProfile || !currentProfile.is_approved) {
      alert("Negalite kandidatuoti – jūsų paskyra dar nepatvirtinta administratoriaus.");
      return;
    }

    const { error } = await supabaseClient
      .from("applications")
      .insert({
        offer_id: offerId,
        worker_id: currentUser.id,
        status: "pending"
      });

    if (error) {
      const msg = (error.message || "").toLowerCase();
      if (msg.includes("duplicate key") || msg.includes("applications_unique")) {
        alert("Jūs jau kandidatuojate į šį pasiūlymą.");
        return;
      }

      alert("Klaida kandidatuojant: " + error.message);
      return;
    }

    alert("Sėkmingai kandidatavote! Darbdavys matys jūsų kandidatūrą.");
  }

  // Atsijungimas
  async function logout() {
    await supabaseClient.auth.signOut();
    location.href = "./auth.html";
  }

  // Paleidimas
  (async () => {
    await loadUser();
    await loadJobs();
  })();

  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("./service-worker.js");
  }
</script>

</body>
</html>
