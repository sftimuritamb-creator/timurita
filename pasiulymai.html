<!doctype html>
<html lang="lt">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Darbo pasiūlymai – Timurita</title>

  <link rel="stylesheet" href="./style.css" />
  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#1a2a44" />

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.48.0/dist/umd/supabase.js"></script>

  <style>
    .offer-card {
      background:#0f172a;
      border-radius:10px;
      padding:10px;
      margin-bottom:10px;
      border:1px solid #1e293b;
    }
    .offer-card h4 { margin:0 0 4px; }
    .offer-card small { color:#9ca3af; }

    /* Toast notifikacija */
    .toast {
      position:fixed;
      left:50%;
      bottom:20px;
      transform:translateX(-50%);
      background:#0f172a;
      color:#e5e7eb;
      padding:10px 14px;
      border-radius:999px;
      border:1px solid #22c55e;
      box-shadow:0 10px 25px rgba(0,0,0,0.5);
      font-size:13px;
      display:none;
      z-index:9999;
    }
  </style>
</head>

<body>
<header class="app-header">
  <h2>Darbo pasiūlymai (Vilnius)</h2>
  <button onclick="logout()" class="btn small" style="margin-left:auto;">Atsijungti</button>
</header>

<main class="container">
  <div class="card">
    <h3>Galimi darbai</h3>
    <div id="offersList">Kraunama...</div>
  </div>
</main>

<div id="toast" class="toast"></div>

<script>
  const supabaseUrl = "https://qnczakppadjxbicgjzcy.supabase.co";
  const supabaseKey =
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFuY3pha3BwYWRqeGJpY2dqemN5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjI5NTYxMjcsImV4cCI6MjA3ODUzMjEyN30.0lAl6L1GU1_uWpULlraaKM0KIfy3lCNSI_wp2X5zDmY";

  const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

  async function checkAuth() {
    const { data } = await supabaseClient.auth.getUser();
    if (!data.user) {
      location.href = "./auth.html";
      return;
    }
    // Leidžiam ir worker, ir employer matyti, jei nori – gali riboti tik worker
  }
  checkAuth();

  async function logout() {
    await supabaseClient.auth.signOut();
    location.href = "./auth.html";
  }

  const offersList = document.getElementById("offersList");

  async function loadOffers() {
    const { data: offers, error } = await supabaseClient
      .from("offers")
      .select("*")
      .eq("city", "Vilnius")
      .order("created_at", { ascending:false });

    offersList.innerHTML = "";

    if (error) {
      offersList.textContent = "Klaida: " + error.message;
      return;
    }

    if (!offers || offers.length === 0) {
      offersList.textContent = "Šiuo metu nėra darbo pasiūlymų Vilniuje.";
      return;
    }

    offers.forEach(o => {
      const div = document.createElement("div");
      div.className = "offer-card";
      div.innerHTML = `
        <h4>${o.title}</h4>
        <small>${o.city}</small><br>
        <div>${o.description || ""}</div>
        <div><strong>Atlygis:</strong> ${o.salary || "-"}</div>
        <button class="btn small" onclick="apply('${o.id}')">Kandidatuoti</button>
      `;
      offersList.appendChild(div);
    });
  }

  loadOffers();

  // Kandidatavimas
  async function apply(offerId) {
    const { data: userData } = await supabaseClient.auth.getUser();
    const user = userData.user;
    if (!user) {
      alert("Reikia prisijungti.");
      location.href = "./auth.html";
      return;
    }

    const { error } = await supabaseClient.from("applications").insert({
      offer_id: offerId,
      worker_id: user.id
    });

    if (error) {
      alert("Klaida kandidatuojant: " + error.message);
    } else {
      alert("Kandidatura išsiųsta.");
    }
  }

  // Toast helperis
  const toastEl = document.getElementById("toast");
  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.style.display = "block";
    setTimeout(() => {
      toastEl.style.display = "none";
    }, 4000);
  }

  // 🔔 Realtime – nauji darbo pasiūlymai Vilniuje
  const offersChannel = supabaseClient
    .channel("public:offers")
    .on(
      "postgres_changes",
      { event: "INSERT", schema: "public", table: "offers" },
      (payload) => {
        const o = payload.new;
        if (o.city === "Vilnius") {
          showToast("🆕 Naujas darbo pasiūlymas Vilniuje: " + o.title);
          // perkelti naujausią į sąrašo viršų: tiesiog perkraunam
          loadOffers();
        }
      }
    )
    .subscribe();
</script>

</body>
</html>
