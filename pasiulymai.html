<!doctype html>
<html lang="lt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Darbo pasiūlymai – Timurita</title>

  <link rel="stylesheet" href="./style.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.48.0/dist/umd/supabase.js"></script>

  <style>
    .pay-box {
      margin-top:8px;
      padding:8px;
      background:#0b1725;
      border:1px solid #1f2f47;
      border-radius:8px;
      color:#8ef;
      font-size:14px;
    }
    .warning-box {
      margin-top:10px;
      padding:10px;
      background:#2f1b00;
      border:1px solid #7a4300;
      border-radius:8px;
      color:#ffb84d;
      font-size:14px;
    }
  </style>
</head>

<body>

<header class="app-header">
  <h2>Darbo pasiūlymai</h2>
</header>

<main class="container">
  <div id="offersList">Kraunama...</div>
</main>

<script>
  const supabaseClient = supabase.createClient(
    "https://qnczakppadjxbicgjzcy.supabase.co",
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFuY3pha3BwYWRqeGJpY2dqemN5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjI5NTYxMjcsImV4cCI6MjA3ODUzMjEyN30.0lAl6L1GU1_uWpULlraaKM0KIfy3lCNSI_wp2X5zDmY"
  );

  let currentUser = null;
  let currentProfile = null;

  // 💸 Darbuotojo atlygio lentele
  const workerPay = {
    "Pagalbinis darbuotojas": "80 € / diena į rankas",
    "Darbuotojas betonuotojas": "100 € / diena į rankas",
    "Darbuotojas Valytoja/as": "7 € / val į rankas"
  };

  // INIT
  (async () => {
    const { data: u } = await supabaseClient.auth.getUser();
    if (!u.user) {
      location.href = "./auth.html";
      return;
    }
    currentUser = u.user;

    // Load profile
    const { data: p } = await supabaseClient
      .from("profiles")
      .select("*")
      .eq("id", currentUser.id)
      .single();

    currentProfile = p;

    loadOffers();
  })();

  // LOAD OFFERS
  async function loadOffers() {
    const list = document.getElementById("offersList");

    const { data, error } = await supabaseClient
      .from("offers")
      .select("*")
      .eq("status", "approved")
      .order("created_at", { ascending: false });

    if (error) {
      list.innerHTML = "Klaida kraunant pasiūlymus.";
      return;
    }

    if (!data.length) {
      list.innerHTML = "Šiuo metu pasiūlymų nėra.";
      return;
    }

    list.innerHTML = "";

    data.forEach(o => {
      const card = document.createElement("div");
      card.className = "card";

      let payInfo = "";

      // 💰 JEIGU DARBUOTOJAS IR PATVIRTINTAS → RODYTI KAINĄ
      if (currentProfile.role === "worker") {

        // Jei NEPATVIRTINTAS — rodyti įspėjimą
        if (!currentProfile.is_approved) {
          payInfo = `
            <div class="warning-box">
              ⚠ Jūsų paskyra dar nepatvirtinta.<br>
              Darbo užmokestis bus matomas tik po patvirtinimo.
            </div>
          `;
        } else {
          // Patvirtintas → rodom atlygi
          const pay = workerPay[o.title] || null;
          if (pay) {
            payInfo = `
              <div class="pay-box">
                💰 <strong>Darbo užmokestis:</strong><br>
                ${pay}
              </div>
            `;
          }
        }
      }

      card.innerHTML = `
        <h3>${o.title}</h3>
        <p><strong>Miestas:</strong> ${o.city}</p>
        <p><strong>Įmonė:</strong> ${o.company}</p>
        <p><strong>Kontaktinis asmuo:</strong> ${o.contact_person || "-"}</p>
        <p><strong>Telefonas:</strong> ${o.phone}</p>
        <p><strong>El. paštas:</strong> ${o.email}</p>

        ${payInfo}

        ${(currentProfile.role === "worker" && currentProfile.is_approved) ? `
          <button class="btn" onclick="apply('${o.id}')">Kandidatuoti</button>
        ` : ""}
      `;

      list.appendChild(card);
    });
  }

  // WORKER APPLY
  async function apply(offerId) {
    const { error } = await supabaseClient
      .from("applications")
      .insert({
        worker_id: currentUser.id,
        offer_id: offerId,
        status: "pending"
      });

    if (error) {
      alert("Klaida kandidatuojant: " + error.message);
      return;
    }

    alert("Kandidatuota sėkmingai!");
  }
</script>

</body>
</html>
