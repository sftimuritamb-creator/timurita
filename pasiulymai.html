<!doctype html>
<html lang="lt">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Darbo pasiūlymai</title>

  <link rel="stylesheet" href="./style.css">
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#1a2a44">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.48.0/dist/umd/supabase.js"></script>

  <style>
    .offer {
      background:#1e293b;
      padding:14px;
      border-radius:12px;
      margin-bottom:12px;
      border:1px solid #334155;
    }
    .offer h3 {
      margin:0 0 6px 0;
    }
    .btn.small {
      padding:6px 10px;
      font-size:13px;
    }
  </style>
</head>

<body>

<header class="app-header">
  <a href="./main.html" style="text-decoration:none;color:inherit;">
    <h2 style="margin:0;">Darbo pasiūlymai</h2>
  </a>
  <button class="btn small" onclick="logout()" style="margin-left:auto;">Atsijungti</button>
</header>

<main class="container">

  <div class="card">
    <h3>Rasti darbo pasiūlymai</h3>
    <p>Rodomi tik <strong>patvirtinti</strong> pasiūlymai.</p>

    <div id="offersList">Kraunama...</div>
  </div>

</main>

<script>
  const supabaseClient = supabase.createClient(
    "https://qnczakppadjxbicgjzcy.supabase.co",
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFuY3pha3BwYWRqeGJpY2dqemN5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjI5NTYxMjcsImV4cCI6MjA3ODUzMjEyN30.0lAl6L1GU1_uWpULlraaKM0KIfy3lCNSI_wp2X5zDmY"
  );

  // --- Apsauga: tik prisijungęs darbuotojas
  async function checkAuth() {
    const { data } = await supabaseClient.auth.getUser();

    if (!data.user) {
      location.href = "./auth.html";
      return;
    }

    const role = data.user.user_metadata?.role;

    if (role !== "worker") {
      alert("Šis puslapis skirtas tik darbuotojams.");
      location.href = "./main.html";
    }
  }
  checkAuth();

  // --- Pakrauti tik patvirtintus darbo pasiūlymus
  async function loadOffers() {
    const { data: offers, error } = await supabaseClient
      .from("offers")
      .select("*")
      .eq("status", "approved")
      .order("created_at", { ascending: false });

    if (error) {
      document.getElementById("offersList").innerText = "Klaida kraunant pasiūlymus.";
      return;
    }

    const box = document.getElementById("offersList");
    box.innerHTML = "";

    if (!offers || offers.length === 0) {
      box.innerHTML = "<p>Nėra patvirtintų darbo pasiūlymų.</p>";
      return;
    }

    offers.forEach(o => {
      const div = document.createElement("div");
      div.className = "offer";
      div.innerHTML = `
        <h3>${o.title}</h3>

        <div><strong>Įmonė:</strong> ${o.company || "Nenurodyta"}</div>
        <div><strong>Įmonės kodas:</strong> ${o.company_code || "Nenurodytas"}</div>
        <div><strong>Miestas:</strong> ${o.city}</div>
        <div><strong>Aprašymas:</strong> ${o.description || "(nėra)"}</div>
        <div><strong>Kontaktas:</strong> ${o.contact || "(nėra)"}</div>

        <button class="btn small" style="margin-top:10px;" onclick="apply('${o.id}')">
          Kandidatuoti
        </button>
      `;
      box.appendChild(div);
    });
  }
  loadOffers();

  // --- Kandidatavimo funkcija
  async function apply(offerId) {
    const { data } = await supabaseClient.auth.getUser();
    const user = data.user;

    if (!user) return alert("Prašome prisijungti.");

    const workerId = user.id;

    // Tikrinti, ar jau kandidatuota
    const { data: existing } = await supabaseClient
      .from("applications")
      .select("*")
      .eq("offer_id", offerId)
      .eq("worker_id", workerId)
      .maybeSingle();

    if (existing) {
      alert("Jūs jau kandidatuojate į šį darbo pasiūlymą.");
      return;
    }

    // Kandidatavimo įrašas
    const { error } = await supabaseClient
      .from("applications")
      .insert({
        offer_id: offerId,
        worker_id: workerId,
        status: "pending"
      });

    if (error) {
      alert("Klaida kandidatuojant.");
    } else {
      alert("Kandidatuota sėkmingai!");
    }
  }

  // --- Atsijungimas
  async function logout() {
    await supabaseClient.auth.signOut();
    location.href = "./auth.html";
  }

  // --- PWA SW
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register("./service-worker.js")
      .catch(err => console.log("SW klaida pasiulymai.html", err));
  }
</script>

</body>
</html>
