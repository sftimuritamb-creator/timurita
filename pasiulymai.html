<!doctype html>
<html lang="lt">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Timurita – Darbo pasiūlymai</title>
  <meta name="description" content="Darbo pasiūlymų sąrašas – peržiūrėkite, filtruokite ir raskite tinkamus pasiūlymus." />

  <!-- PWA -->
  <link rel="manifest" href="/timurita/manifest.json">
  <meta name="theme-color" content="#1a2a44">
  <link rel="icon" href="/timurita/Timurita_logo_192x192.png" type="image/png">
  <link rel="apple-touch-icon" href="/timurita/Timurita_logo_512x512.png">

  <!-- CSS -->
  <link rel="stylesheet" href="/timurita/style.css">
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background:#f8fafc; margin:0; color:#0f172a; }
    .app-header { display:flex; align-items:center; gap:10px; padding:12px 16px; background:#fff; border-bottom:1px solid #e2e8f0; }
    .app-header img { width:40px; height:40px; border-radius:8px; }
    .container { max-width:960px; margin:0 auto; padding:16px; }
    .card { background:#fff; border:1px solid #e2e8f0; border-radius:12px; padding:16px; box-shadow:0 1px 2px rgba(0,0,0,0.04); margin-bottom:14px; }
    .card h2 { margin:0 0 8px 0; }
    .muted { color:#475569; }
    .filters { display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-bottom:16px; }
    .filters input { flex:1; min-width:160px; padding:8px 10px; border:1px solid #cbd5e1; border-radius:8px; }
    .filters button { padding:8px 14px; border:none; border-radius:8px; background:#0f766e; color:#fff; font-weight:600; cursor:pointer; }
    .filters button:hover { filter:brightness(.95); }
    .empty { text-align:center; color:#64748b; padding:40px 0; }
    nav.bottom-nav { position:sticky; bottom:0; display:grid; grid-template-columns:repeat(4,1fr); background:#ffffffcc; backdrop-filter: blur(6px); border-top:1px solid #e2e8f0; padding:10px; }
    .bottom-nav a { text-align:center; text-decoration:none; padding:10px; border-radius:10px; color:#0f172a; font-weight:600; background:#fff; border:1px solid #e2e8f0; }
    .salary { color:#16a34a; font-weight:600; }
  </style>
</head>

<body>
  <header class="app-header">
    <a href="/timurita/index.html" style="display:flex;align-items:center;text-decoration:none;color:inherit">
      <img src="/timurita/Timurita_logo_192x192.png" alt="Timurita logotipas" width="40" height="40" loading="lazy" decoding="async">
      <div>
        <h3 style="margin:0;">Timurita</h3>
        <div style="font-size:12px;color:#475569;">Sujungiame darbdavius ir statybų specialistus</div>
      </div>
    </a>
  </header>

  <main class="container">
    <h1>Darbo pasiūlymai</h1>
    <p class="muted">Peržiūrėkite visus išsaugotus pasiūlymus (veikia offline). Galite filtruoti pagal miestą ar įmonę.</p>

    <div class="filters">
      <input id="filterCity" placeholder="Filtruoti pagal miestą...">
      <input id="filterCompany" placeholder="Filtruoti pagal įmonę...">
      <button id="refreshBtn">🔄 Atnaujinti</button>
    </div>

    <div id="offersList"></div>
  </main>

  <nav class="bottom-nav" aria-label="Apatinė navigacija">
    <a href="/timurita/darbuotojai.html">Darbuotojai</a>
    <a href="/timurita/pasiulymai.html" aria-current="page">Pasiūlymai</a>
    <a href="/timurita/profilis.html">Profilis</a>
    <a href="/timurita/darbdavys.html">Darbdavys</a>
  </nav>

  <!-- Logika: bendras db.js -->
  <script type="module">
    import { getAllOffers } from '/timurita/db.js';

    const listEl = document.getElementById('offersList');
    const fCity  = document.getElementById('filterCity');
    const fComp  = document.getElementById('filterCompany');
    const refreshBtn = document.getElementById('refreshBtn');

    const renderOffers = (offers) => {
      listEl.innerHTML = '';
      if (!offers || offers.length === 0) {
        listEl.innerHTML = `<div class="empty">🕐 Kol kas nėra pasiūlymų.</div>`;
        return;
      }

      for (const o of offers) {
        const el = document.createElement('article');
        el.className = 'card';
        el.innerHTML = `
          <h2>${o.title || '(be pavadinimo)'}</h2>
          <p><strong>${o.company || 'Nežinoma įmonė'}</strong> – ${o.city || 'nenurodytas miestas'}</p>
          ${o.salary ? `<p class="salary">💶 ${o.salary}</p>` : ''}
          <p>${o.desc || ''}</p>
          <p class="muted" style="font-size:13px;">Kontaktai: ${o.contact || ''} ${o.phone ? '📞 '+o.phone : ''} ${o.email ? '✉️ '+o.email : ''}</p>
        `;
        listEl.appendChild(el);
      }
    };

    async function loadOffers() {
      const all = await getAllOffers();
      let filtered = all;
      const cityVal = fCity.value.trim().toLowerCase();
      const compVal = fComp.value.trim().toLowerCase();
      if (cityVal) filtered = filtered.filter(o => (o.city || '').toLowerCase().includes(cityVal));
      if (compVal) filtered = filtered.filter(o => (o.company || '').toLowerCase().includes(compVal));
      renderOffers(filtered);
    }

    // Eventai
    fCity.addEventListener('input', loadOffers);
    fComp.addEventListener('input', loadOffers);
    refreshBtn.addEventListener('click', loadOffers);

    // Užkrauname kai atidaroma
    loadOffers();
  </script>

  <!-- Service Worker -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/timurita/service-worker.js')
        .then(()=>console.log('Service worker registered'))
        .catch(e=>console.log('SW error', e));
    }
  </script>
</body>
</html>
