<!doctype html>
<html lang="lt">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Timurita – Darbo pasiūlymai</title>
  <meta name="description" content="Peržiūrėkite darbo pasiūlymus ir kandidatuokite kaip darbuotojas.">

  <!-- PWA -->
  <link rel="manifest" href="/timurita/manifest.json">
  <meta name="theme-color" content="#1a2a44">
  <link rel="icon" href="/timurita/Timurita_logo_192x192.png" type="image/png">

  <link rel="stylesheet" href="/timurita/style.css">

  <style>
    :root{ --bg:#f8fafc; --fg:#0f172a; --muted:#64748b; --line:#e2e8f0; --card:#ffffff; --primary:#0f766e; --danger:#b91c1c; --badge:#e0f2fe; }
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background:var(--bg); margin:0; color:var(--fg); }
    .app-header { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:12px 16px; background:var(--card); border-bottom:1px solid var(--line); }
    .left { display:flex; align-items:center; gap:10px; }
    .app-header img { width:40px; height:40px; border-radius:8px; }
    .header-actions { display:flex; gap:8px; align-items:center; }
    .role-pill { font-size:12px; padding:4px 10px; border-radius:999px; background:#ecfeff; color:#0e7490; border:1px solid #bae6fd; }
    .logout-btn { padding:6px 10px; border-radius:999px; border:1px solid var(--line); background:#fee2e2; color:#b91c1c; font-size:12px; font-weight:600; cursor:pointer; }

    .container { max-width:980px; margin:0 auto; padding:16px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; box-shadow:0 1px 2px rgba(15,23,42,0.05); margin-bottom:16px; }
    .muted { color:var(--muted); }

    .filters { display:flex; flex-wrap:wrap; gap:10px; margin-top:10px; }
    .filters input, .filters select { padding:8px 10px; border-radius:999px; border:1px solid var(--line); background:#f8fafc; font-size:13px; }
    .filters input { min-width:160px; }
    .badge { display:inline-block; padding:2px 8px; border-radius:999px; background:var(--badge); color:#0369a1; font-size:12px; font-weight:700; }

    .offers-list { display:flex; flex-direction:column; gap:10px; margin-top:12px; }
    .offer-card { border:1px solid var(--line); border-radius:12px; padding:12px 14px; background:var(--card); display:flex; flex-direction:column; gap:6px; }
    .offer-header { display:flex; justify-content:space-between; align-items:center; gap:8px; }
    .offer-title { font-size:15px; font-weight:700; margin:0; }
    .offer-meta { font-size:12px; color:var(--muted); }
    .offer-desc { font-size:13px; color:#0f172a; }
    .offer-footer { display:flex; justify-content:space-between; align-items:center; gap:8px; margin-top:4px; flex-wrap:wrap; }

    .btn { padding:7px 11px; font-size:13px; font-weight:600; border-radius:999px; cursor:pointer; border:1px solid var(--line); display:inline-flex; align-items:center; gap:6px; }
    .btn.primary { background:var(--primary); color:#fff; border-color:var(--primary); }
    .btn.secondary { background:#f8fafc; color:#0f172a; }
    .btn.small { padding:5px 9px; font-size:12px; }

    .btn[disabled] { opacity:0.6; cursor:default; }
    .status { font-size:12px; color:var(--muted); margin-top:6px; min-height:16px; }

    nav.bottom-nav { position:sticky; bottom:0; display:grid; grid-template-columns:repeat(4,1fr); background:rgba(248,250,252,0.95); border-top:1px solid var(--line); padding:10px; backdrop-filter:blur(6px); }
    .bottom-nav a { text-align:center; text-decoration:none; padding:10px; border-radius:10px; color:var(--fg); font-weight:600; background:var(--card); border:1px solid var(--line); font-size:14px; }
    .bottom-nav a[aria-current="page"] { background:var(--primary); color:#fff; border-color:var(--primary); }

    @media (max-width: 700px) {
      .offer-header { flex-direction:column; align-items:flex-start; }
      .offer-footer { flex-direction:column; align-items:flex-start; }
    }
  </style>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.48.0/dist/umd/supabase.js"></script>
</head>
<body>
  <header class="app-header">
    <div class="left">
      <a href="/timurita/index.html" style="display:flex;align-items:center;text-decoration:none;color:inherit">
        <img src="/timurita/Timurita_logo_192x192.png" alt="Timurita" loading="lazy">
        <div>
          <h3 style="margin:0;">Timurita</h3>
          <div style="font-size:12px;color:var(--muted)">Darbo pasiūlymai statybų sektoriuje</div>
        </div>
      </a>
    </div>
    <div class="header-actions">
      <span class="role-pill" id="roleInfo">Neprisijungta</span>
      <button class="logout-btn" type="button" id="logoutBtn" style="display:none;">Atsijungti</button>
    </div>
  </header>

  <main class="container">
    <section class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;">
        <h1 style="margin:0;">Darbo pasiūlymai</h1>
        <span class="badge">Pasiūlymai iš darbdavių</span>
      </div>
      <p class="muted" style="margin-top:6px;">
        Čia matote visus viešus darbo pasiūlymus. Kandidatuoti gali tik prisijungęs vartotojas su role
        <strong>„Darbuotojas“</strong>.
      </p>

      <div class="filters">
        <input type="search" id="searchText" placeholder="Paieška pagal pavadinimą ar aprašymą">
        <input type="search" id="searchCity" placeholder="Miestas (pvz. Vilnius)">
        <select id="filterApplied">
          <option value="all">Visi pasiūlymai</option>
          <option value="not-applied">Į kuriuos dar nekandidatavau</option>
          <option value="applied">Į kuriuos jau kandidatuota</option>
        </select>
      </div>

      <div class="status" id="offersStatus">Kraunami pasiūlymai...</div>
      <div class="offers-list" id="offersList"></div>
    </section>
  </main>

  <nav class="bottom-nav" aria-label="Apatinė navigacija">
    <a href="/timurita/darbuotojai.html">Darbuotojai</a>
    <a href="/timurita/pasiulymai.html" aria-current="page">Pasiūlymai</a>
    <a href="/timurita/profilis.html">Profilis</a>
    <a href="/timurita/darbdavys.html">Darbdavys</a>
  </nav>

  <script>
    // --- Supabase ir globalūs kintamieji ---
    let supabaseClient = null;
    let currentUser = null;
    let currentRole = 'guest'; // 'guest' | 'worker' | 'employer'
    let allOffers = [];
    let appliedMap = {}; // { offer_id: true } – į kuriuos pasiūlymus šis darbuotojas jau kandidatuotas

    const WORKER_PROFILE_KEY = 'timurita_worker_profile';

    try {
      if (window.supabase) {
        const supabaseUrl = 'https://qnczakppadjxbicgjzcy.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFuY3pha3BwYWRqeGJpY2dqemN5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjI5NTYxMjcsImV4cCI6MjA3ODUzMjEyN30.0lAl6L1GU1_uWpULlraaKM0KIfy3lCNSI_wp2X5zDmY';
        supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);
      } else {
        console.warn('Supabase biblioteka neužsikrovė');
      }
    } catch (e) {
      console.warn('Supabase createClient klaida pasiulymai.html:', e);
    }

    const roleInfo = document.getElementById('roleInfo');
    const logoutBtn = document.getElementById('logoutBtn');
    const offersStatus = document.getElementById('offersStatus');
    const offersList = document.getElementById('offersList');
    const searchText = document.getElementById('searchText');
    const searchCity = document.getElementById('searchCity');
    const filterApplied = document.getElementById('filterApplied');

    // --- Pagalbinės funkcijos ---
    function formatDate(iso) {
      if (!iso) return '';
      try {
        const d = new Date(iso);
        return d.toLocaleDateString('lt-LT') + ' ' + d.toLocaleTimeString('lt-LT', { hour: '2-digit', minute: '2-digit' });
      } catch {
        return iso;
      }
    }

    function getWorkerProfile() {
      try {
        const raw = localStorage.getItem(WORKER_PROFILE_KEY);
        if (!raw) return null;
        return JSON.parse(raw);
      } catch (e) {
        console.warn('Nepavyko nuskaityti worker profilio:', e);
        return null;
      }
    }

    function updateRoleUI() {
      if (currentUser) {
        logoutBtn.style.display = 'inline-flex';
      } else {
        logoutBtn.style.display = 'none';
      }

      if (currentRole === 'worker') {
        roleInfo.textContent = 'Prisijungta kaip darbuotojas';
        roleInfo.style.background = '#dcfce7';
        roleInfo.style.color = '#166534';
        roleInfo.style.borderColor = '#bbf7d0';
      } else if (currentRole === 'employer') {
        roleInfo.textContent = 'Prisijungta kaip darbdavys';
        roleInfo.style.background = '#fee2e2';
        roleInfo.style.color = '#b91c1c';
        roleInfo.style.borderColor = '#fecaca';
      } else {
        roleInfo.textContent = 'Neprisijungta';
        roleInfo.style.background = '#ecfeff';
        roleInfo.style.color = '#0e7490';
        roleInfo.style.borderColor = '#bae6fd';
      }
    }

    // --- Auth informacijai ---
    async function initAuth() {
      if (!supabaseClient) {
        currentUser = null;
        currentRole = 'guest';
        updateRoleUI();
        return;
      }

      try {
        const { data: { user }, error } = await supabaseClient.auth.getUser();
        if (error || !user) {
          currentUser = null;
          currentRole = 'guest';
        } else {
          currentUser = user;
          currentRole = user.user_metadata?.role || 'worker';
        }
      } catch (e) {
        console.warn('getUser klaida:', e);
        currentUser = null;
        currentRole = 'guest';
      }

      updateRoleUI();

      // jei tai darbuotojas – užkraunam, į ką jis jau kandidatuotas
      if (currentUser && currentRole === 'worker') {
        await loadMyApplicationsMap();
      }
    }

    async function loadMyApplicationsMap() {
      appliedMap = {};
      if (!supabaseClient || !currentUser) return;

      try {
        const { data, error } = await supabaseClient
          .from('applications')
          .select('offer_id')
          .eq('worker_id', currentUser.id);

        if (error) {
          console.warn('loadMyApplicationsMap klaida:', error);
          return;
        }

        if (data) {
          data.forEach(row => {
            if (row.offer_id) appliedMap[row.offer_id] = true;
          });
        }
      } catch (e) {
        console.warn('loadMyApplicationsMap klaida:', e);
      }
    }

    // --- Pasiūlymų užkrovimas iš Supabase ---
    async function loadOffers() {
      offersList.innerHTML = '';
      offersStatus.textContent = 'Kraunami pasiūlymai...';

      if (!supabaseClient) {
        offersStatus.textContent = 'Supabase klientas nepasiekiamas. Pabandykite persikrauti puslapį.';
        return;
      }

      try {
        const { data, error } = await supabaseClient
          .from('offers')
          .select('*')
          .order('created_at', { ascending: false });

        if (error) {
          console.warn('loadOffers klaida:', error);
          offersStatus.textContent = 'Klaida gaunant pasiūlymus: ' + (error.message || 'nežinoma');
          return;
        }

        allOffers = data || [];
        if (!allOffers.length) {
          offersStatus.textContent = 'Šiuo metu nėra darbo pasiūlymų.';
          return;
        }

        offersStatus.textContent = 'Rasta pasiūlymų: ' + allOffers.length;
        renderOffers();
      } catch (e) {
        console.warn('loadOffers klaida:', e);
        offersStatus.textContent = 'Klaida gaunant pasiūlymus: ' + e.message;
      }
    }

    // --- Filtravimas ir atvaizdavimas ---
    function renderOffers() {
      offersList.innerHTML = '';

      const text = (searchText.value || '').trim().toLowerCase();
      const city = (searchCity.value || '').trim().toLowerCase();
      const filter = filterApplied.value;

      const filtered = allOffers.filter(o => {
        if (text) {
          const hay = ((o.title || '') + ' ' + (o.description || '')).toLowerCase();
          if (!hay.includes(text)) return false;
        }
        if (city) {
          const c = (o.city || '').toLowerCase();
          if (!c.includes(city)) return false;
        }

        if (currentUser && currentRole === 'worker') {
          const isApplied = !!appliedMap[o.id];
          if (filter === 'applied' && !isApplied) return false;
          if (filter === 'not-applied' && isApplied) return false;
        } else {
          // svečias ar darbdavys – filtras pagal kandidatuota nelabai prasmingas
          if (filter !== 'all') {
            // galim paprastai leisti tik "visi pasiūlymai"
            if (filter === 'applied' || filter === 'not-applied') {
              // jei ne worker – rodom viską
            }
          }
        }

        return true;
      });

      if (!filtered.length) {
        const div = document.createElement('div');
        div.className = 'muted';
        div.style.marginTop = '8px';
        div.textContent = 'Pagal pasirinktus filtrus pasiūlymų nerasta.';
        offersList.appendChild(div);
        return;
      }

      filtered.forEach(o => {
        const card = document.createElement('article');
        card.className = 'offer-card';

        const header = document.createElement('div');
        header.className = 'offer-header';

        const titleEl = document.createElement('h2');
        titleEl.className = 'offer-title';
        titleEl.textContent = o.title || 'Be pavadinimo';

        const metaRight = document.createElement('div');
        metaRight.style.fontSize = '12px';
        metaRight.style.textAlign = 'right';
        metaRight.innerHTML =
          (o.city ? `<div>${o.city}</div>` : '') +
          (o.salary ? `<div><strong>${o.salary}</strong></div>` : '') +
          (o.created_at ? `<div style="color:#94a3b8;">${formatDate(o.created_at)}</div>` : '');

        header.appendChild(titleEl);
        header.appendChild(metaRight);

        const meta = document.createElement('div');
        meta.className = 'offer-meta';
        const comp = o.company || '';
        const contact = o.contact || '';
        const phone = o.phone || '';
        const email = o.email || '';

        let metaText = '';
        if (comp) metaText += comp;
        if (contact) {
          if (metaText) metaText += ' • ';
          metaText += contact;
        }
        if (phone) metaText += (metaText ? ' • Tel. ' : 'Tel. ') + phone;
        if (email) metaText += (metaText ? ' • ' : '') + email;

        meta.textContent = metaText;

        const desc = document.createElement('div');
        desc.className = 'offer-desc';
        desc.textContent = o.description || 'Darbo aprašymas nepateiktas.';

        const footer = document.createElement('div');
        footer.className = 'offer-footer';

        const leftInfo = document.createElement('div');
        leftInfo.style.fontSize = '12px';
        leftInfo.style.color = '#64748b';
        leftInfo.textContent = 'Norėdami kandidatuoti, turite būti prisijungęs kaip darbuotojas.';

        const rightButtons = document.createElement('div');
        rightButtons.style.display = 'flex';
        rightButtons.style.gap = '6px';
        rightButtons.style.flexWrap = 'wrap';

        const applyBtn = document.createElement('button');
        applyBtn.type = 'button';
        applyBtn.className = 'btn small primary';
        applyBtn.textContent = 'Kandidatuoti';

        if (!currentUser) {
          applyBtn.addEventListener('click', () => {
            alert('Norėdami kandidatuoti, pirmiausia prisijunkite kaip darbuotojas.');
            window.location.href = '/timurita/auth.html';
          });
        } else if (currentRole !== 'worker') {
          applyBtn.disabled = true;
          applyBtn.textContent = 'Tik darbuotojams';
          leftInfo.textContent = 'Jūs prisijungęs ne kaip darbuotojas. Kandidatuoti gali tik darbuotojai.';
        } else {
          const isApplied = !!appliedMap[o.id];
          if (isApplied) {
            applyBtn.disabled = true;
            applyBtn.classList.remove('primary');
            applyBtn.classList.add('secondary');
            applyBtn.textContent = 'Jau kandidatuota';
          } else {
            applyBtn.addEventListener('click', () => {
              handleApply(o);
            });
          }
          leftInfo.textContent = 'Kandidatuojant bus panaudoti jūsų profilyje nurodyti duomenys.';
        }

        rightButtons.appendChild(applyBtn);
        footer.appendChild(leftInfo);
        footer.appendChild(rightButtons);

        card.appendChild(header);
        card.appendChild(meta);
        card.appendChild(desc);
        card.appendChild(footer);

        offersList.appendChild(card);
      });
    }

    // --- Kandidatavimas ---
    async function handleApply(offer) {
      if (!currentUser || currentRole !== 'worker') {
        alert('Norėdami kandidatuoti, prisijunkite kaip darbuotojas.');
        window.location.href = '/timurita/auth.html';
        return;
      }

      const profile = getWorkerProfile();
      if (!profile) {
        const go = confirm('Pirmiausia užpildykite savo profilį, kad darbdavys matytų jūsų duomenis. Eiti į profilį dabar?');
        if (go) window.location.href = '/timurita/profilis.html';
        return;
      }

      if (!supabaseClient) {
        alert('Supabase nepasiekiamas, pabandykite vėliau.');
        return;
      }

      const confirmText = `Kandidatuosite į: "${offer.title || ''}"\nDarbdavys: ${offer.company || ''}\n\nBus perduoti jūsų profilio duomenys.\nTęsti?`;
      if (!confirm(confirmText)) return;

      offersStatus.textContent = 'Siunčiama kandidatūra...';

      try {
        // saugumo sumetimais patikrinam, ar dar nėra tokios paraiškos
        const { data: existing, error: checkError } = await supabaseClient
          .from('applications')
          .select('id')
          .eq('offer_id', offer.id)
          .eq('worker_id', currentUser.id)
          .limit(1);

        if (checkError) {
          console.warn('Check existing application klaida:', checkError);
        } else if (existing && existing.length) {
          alert('Jūs jau kandidatuojate į šį pasiūlymą.');
          appliedMap[offer.id] = true;
          renderOffers();
          offersStatus.textContent = 'Jau buvote kandidatavęs į šį pasiūlymą.';
          return;
        }

        const { error } = await supabaseClient.from('applications').insert({
          offer_id: offer.id,
          worker_id: currentUser.id,
          worker_name: profile.fullName || profile.name || null,
          worker_city: profile.city || null,
          worker_phone: profile.phone || null,
          worker_email: profile.email || currentUser.email || null,
          worker_note: profile.about || null
        });

        if (error) {
          console.warn('Insert application klaida:', error);
          alert('Nepavyko išsiųsti kandidatūros: ' + (error.message || 'nežinoma klaida'));
          offersStatus.textContent = 'Klaida siunčiant kandidatūrą.';
          return;
        }

        appliedMap[offer.id] = true;
        renderOffers();
        offersStatus.textContent = '✅ Kandidatūra išsiųsta darbdaviui.';
      } catch (e) {
        console.warn('handleApply klaida:', e);
        alert('Klaida siunčiant kandidatūrą: ' + e.message);
        offersStatus.textContent = 'Klaida siunčiant kandidatūrą.';
      }
    }

    // --- Atsijungimas ---
    logoutBtn.addEventListener('click', async () => {
      if (!supabaseClient) {
        window.location.href = '/timurita/auth.html';
        return;
      }
      try {
        await supabaseClient.auth.signOut();
      } catch (e) {
        console.warn('signOut klaida:', e);
      }
      try { localStorage.removeItem('timurita_role'); } catch {}
      window.location.href = '/timurita/auth.html';
    });

    // --- Inicializacija ---
    document.addEventListener('DOMContentLoaded', async () => {
      await initAuth();
      await loadOffers();

      searchText.addEventListener('input', renderOffers);
      searchCity.addEventListener('input', renderOffers);
      filterApplied.addEventListener('change', renderOffers);
    });

    // Service worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/timurita/service-worker.js')
        .then(()=>console.log('SW registered (pasiulymai.html)'))
        .catch(e=>console.log('SW error', e));
    }
  </script>
</body>
</html>
