<!doctype html>
<html lang="lt">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Darbo pasiūlymai – Timurita</title>

  <link rel="stylesheet" href="./style.css">
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#1a2a44">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.48.0/dist/umd/supabase.js"></script>

  <style>
    .job-card {
      background:#1e293b;
      border:1px solid #334155;
      padding:14px;
      border-radius:12px;
      margin-bottom:12px;
    }
    .btn.small {
      padding:6px 10px;
      font-size:13px;
    }
    .tag {
      padding:3px 7px;
      border-radius:6px;
      font-size:11px;
    }
    .tag.approved {
      background:#065f46;
      color:#a7f3d0;
      border:1px solid #34d399;
    }
  </style>
</head>
<body>

<header class="app-header">
  <h2>Darbo pasiūlymai</h2>
  <button onclick="logout()" class="btn small" style="margin-left:auto;">Atsijungti</button>
</header>

<main class="container">

  <div class="card">
    <h3>Visi patvirtinti pasiūlymai</h3>
    <p>Galite kandidatuoti tik tada, jei administratorius patvirtino jūsų paskyrą.</p>

    <div id="jobsList">Kraunama...</div>
  </div>

</main>

<script>
  const supabaseClient = supabase.createClient(
    "https://qnczakppadjxbicgjzcy.supabase.co",
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFuY3pha3BwYWRqeGJpY2dqemN5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjI5NTYxMjcsImV4cCI6MjA3ODUzMjEyN30.0lAl6L1GU1_uWpULlraaKM0KIfy3lCNSI_wp2X5zDmY"
  );

  let currentUser = null;
  let currentProfile = null;

  // 1️⃣ Tik darbuotojas gali kandidatuoti
  async function loadUser() {
    const { data, error } = await supabaseClient.auth.getUser();

    if (error || !data.user) {
      location.href = "./auth.html";
      return;
    }

    currentUser = data.user;

    const role = currentUser.user_metadata?.role;

    if (role !== "worker") {
      console.log("Usuario role:", role);
      return; // admin ir darbdavys mato pasiūlymus, bet negali kandidatuoti
    }

    // Atsisiunčiam profilį (kad patikrinti is_approved)
    const { data: profile } = await supabaseClient
      .from("profiles")
      .select("*")
      .eq("id", currentUser.id)
      .maybeSingle();

    currentProfile = profile;
  }

  // 2️⃣ Įkeliam visus patvirtintus pasiūlymus
  async function loadJobs() {
    const box = document.getElementById("jobsList");

    const { data: offers, error } = await supabaseClient
      .from("offers")
      .select("*")
      .eq("approved", true)
      .order("created_at", { ascending: false });

    if (error) {
      box.innerHTML = `<p>Klaida kraunant pasiūlymus.</p>`;
      return;
    }

    if (!offers || offers.length === 0) {
      box.innerHTML = `<p>Nėra patvirtintų pasiūlymų.</p>`;
      return;
    }

    box.innerHTML = "";
    offers.forEach(o => {
      const div = document.createElement("div");
      div.className = "job-card";

      div.innerHTML = `
        <h3>${o.title}</h3>
        <div><strong>Įmonė:</strong> ${o.company}</div>
        <div><strong>Įmonės kodas:</strong> ${o.company_code || "-"}</div>
        <div><strong>Miestas:</strong> ${o.city}</div>
        <div><strong>Atlygis:</strong> ${o.salary || "-"}</div>
        <p style="margin-top:10px;">${o.description || ""}</p>
        <br>
        <div id="btn-${o.id}"></div>
      `;

      box.appendChild(div);

      renderApplyButton(o.id);
    });
  }

  // 3️⃣ parodyti / paslėpti kandidatuoti mygtuką
  function renderApplyButton(offerId) {
    const area = document.getElementById(`btn-${offerId}`);

    if (!currentUser) return;
    if (!currentProfile) return;

    // admin ir darbdavys negali
    if (currentUser.user_metadata.role !== "worker") {
      area.innerHTML = "";
      return;
    }

    // nepatvirtintas darbuotojas
    if (!currentProfile.is_approved) {
      area.innerHTML = `<p style="color:#fbbf24;">Jūsų paskyra dar nepatvirtinta — negalite kandidatuoti.</p>`;
      return;
    }

    // viskas OK – gali kandidatuoti
    area.innerHTML = `
      <button class="btn small" onclick="apply('${offerId}')">Kandidatuoti</button>
    `;
  }

  // 4️⃣ kandidatuoti funkcija
  async function apply(offerId) {
    if (!currentProfile.is_approved) {
      alert("Negalite kandidatuoti — paskyra nepatvirtinta.");
      return;
    }

    const { error } = await supabaseClient
      .from("applications")
      .insert({
        offer_id: offerId,
        worker_id: currentUser.id,
      });

    if (error) {
      alert("Klaida kandidatuojant: " + error.message);
      return;
    }

    alert("Sėkmingai kandidatavote!");
  }

  // ATSIJUNGIMAS
  async function logout() {
    await supabaseClient.auth.signOut();
    location.href = "./auth.html";
  }

  // paleidimas
  (async () => {
    await loadUser();
    await loadJobs();
  })();

  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("./service-worker.js");
  }
</script>

</body>
</html>
