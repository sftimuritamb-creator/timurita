<!doctype html>
<html lang="lt">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Timurita – Darbo pasiūlymai</title>
  <meta name="description" content="Darbo pasiūlymai – Timurita platforma." />

  <!-- PWA ir stiliai -->
  <link rel="manifest" href="/timurita/manifest.json">
  <meta name="theme-color" content="#1a2a44">
  <link rel="icon" href="/timurita/Timurita_logo_192x192.png" type="image/png">
  <link rel="stylesheet" href="/timurita/style.css">

  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background:#f8fafc; margin:0; color:#0f172a; }
    .app-header { display:flex; align-items:center; gap:10px; padding:12px 16px; background:#fff; border-bottom:1px solid #e2e8f0; }
    .app-header img { width:40px; height:40px; border-radius:8px; }
    .container { max-width:920px; margin:0 auto; padding:16px; }
    .grid { display:grid; grid-template-columns: 1fr 2fr; gap:16px; }
    @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
    .card { background:#fff; border:1px solid #e2e8f0; border-radius:12px; padding:16px; box-shadow:0 1px 2px rgba(0,0,0,0.04); }
    .muted { color:#475569; }
    label { display:block; margin-top:12px; font-weight:600; color:#334155; }
    input, textarea { width:100%; padding:10px; border:1px solid #cbd5e1; border-radius:8px; margin-top:4px; }
    textarea { min-height:90px; resize:vertical; }
    .row { display:flex; gap:10px; }
    .row > * { flex:1; }
    button.btn { padding:10px 14px; font-size:14px; font-weight:600; background:#0f766e; color:#fff; border:none; border-radius:10px; cursor:pointer; }
    button.btn:hover { background:#115e59; }
    button.outline { background:#fff; color:#0f172a; border:1px solid #cbd5e1; }
    .offer { display:flex; flex-direction:column; gap:6px; }
    .offer h3 { margin:0; font-size:18px; }
    .offer .meta { font-size:13px; color:#475569; }
    .offer .actions { display:flex; gap:8px; margin-top:6px; }
    nav.bottom-nav { position:sticky; bottom:0; display:grid; grid-template-columns:repeat(4,1fr); background:#ffffffcc; backdrop-filter: blur(6px); border-top:1px solid #e2e8f0; padding:10px; }
    .bottom-nav a { text-align:center; text-decoration:none; padding:10px; border-radius:10px; color:#0f172a; font-weight:600; background:#fff; border:1px solid #e2e8f0; }
  </style>
</head>

<body>
  <header class="app-header">
    <a href="/timurita/index.html" style="display:flex;align-items:center;text-decoration:none;color:inherit">
      <img src="/timurita/Timurita_logo_192x192.png" alt="Timurita logotipas">
      <div>
        <h3 style="margin:0;">Timurita</h3>
        <div style="font-size:12px;color:#475569;">Sujungiame darbdavius ir statybų specialistus</div>
      </div>
    </a>
  </header>

  <main class="container">
    <h1>Darbo pasiūlymai</h1>
    <p class="muted">Pridėk pasiūlymą (demo režimas – duomenys saugomi tavo įrenginyje, veikia offline).</p>

    <div class="grid">
      <!-- Kairė: naujo pasiūlymo forma -->
      <section class="card">
        <h2 style="margin-top:0;">Naujas pasiūlymas</h2>
        <form id="offerForm">
          <label>Pavadinimas
            <input name="title" required placeholder="Pvz. Mūrininkas">
          </label>

          <div class="row">
            <label>Miestas
              <input name="city" placeholder="Pvz. Vilnius">
            </label>
            <label>Įmonė
              <input name="company" placeholder="Pvz. UAB Statyba">
            </label>
          </div>

          <label>Aprašymas
            <textarea name="desc" placeholder="Trumpas darbo aprašymas"></textarea>
          </label>

          <button class="btn" type="submit" style="margin-top:12px;">Pridėti pasiūlymą</button>
        </form>
      </section>

      <!-- Dešinė: pasiūlymų sąrašas -->
      <section class="card">
        <div style="display:flex; align-items:center; justify-content:space-between;">
          <h2 style="margin:0;">Esami pasiūlymai</h2>
          <button id="seedBtn" class="btn outline" title="Įkelti pavyzdžius">Įkelti pavyzdžius</button>
        </div>
        <div id="offersList" style="margin-top:12px;"></div>
      </section>
    </div>
  </main>

  <nav class="bottom-nav">
    <a href="/timurita/darbuotojai.html">Darbuotojai</a>
    <a href="/timurita/pasiulymai.html">Pasiūlymai</a>
    <a href="/timurita/profilis.html">Profilis</a>
    <a href="/timurita/darbdavys.html">Darbdavys</a>
  </nav>

  <!-- Puslapio logika: IndexedDB (offers) -->
  <script type="module">
    // Šiame puslapyje pasidarome labai mažą „offers“ DB (atskirai nuo profiles).
    const DB_NAME = 'timurita-db';
    const DB_VERSION = 2;           // jei vėliau keisi struktūrą – padidink
    const STORE = 'offers';

    function openDB() {
      return new Promise((res, rej) => {
        const req = indexedDB.open(DB_NAME, DB_VERSION);
        req.onupgradeneeded = () => {
          const db = req.result;
          if (!db.objectStoreNames.contains(STORE)) {
            db.createObjectStore(STORE, { keyPath: 'id' });
          }
          // paliekam vietos kitoms lentelėms ateičiai
        };
        req.onsuccess = () => res(req.result);
        req.onerror = () => rej(req.error);
      });
    }

    async function saveOffer(offer) {
      const db = await openDB();
      return new Promise((res, rej) => {
        const tx = db.transaction(STORE, 'readwrite');
        tx.objectStore(STORE).put(offer);
        tx.oncomplete = () => res();
        tx.onerror = () => rej(tx.error);
      });
    }

    async function getAllOffers() {
      const db = await openDB();
      return new Promise((res, rej) => {
        const tx = db.transaction(STORE, 'readonly');
        const req = tx.objectStore(STORE).getAll();
        req.onsuccess = () => res(req.result || []);
        req.onerror = () => rej(req.error);
      });
    }

    async function deleteOffer(id) {
      const db = await openDB();
      return new Promise((res, rej) => {
        const tx = db.transaction(STORE, 'readwrite');
        tx.objectStore(STORE).delete(id);
        tx.oncomplete = () => res();
        tx.onerror = () => rej(tx.error);
      });
    }

    // UI valdymas
    const form = document.querySelector('#offerForm');
    const list = document.querySelector('#offersList');
    const seedBtn = document.querySelector('#seedBtn');

    function uuid() {
      return (crypto && crypto.randomUUID) ? crypto.randomUUID() :
        'id-' + Math.random().toString(36).slice(2, 10);
    }

    function card(o) {
      const desc = o.desc ? `<div class="muted">${escapeHtml(o.desc)}</div>` : '';
      const meta = `
        <div class="meta">
          ${o.city ? escapeHtml(o.city) : ''} ${o.company ? '• ' + escapeHtml(o.company) : ''}
        </div>`;
      return `
        <div class="offer" data-id="${o.id}">
          <h3>${escapeHtml(o.title ?? 'Be pavadinimo')}</h3>
          ${meta}
          ${desc}
          <div class="actions">
            <button class="btn" data-action="apply">Kandidatuoti</button>
            <button class="btn outline" data-action="delete">Šalinti</button>
          </div>
          <hr style="border:none; border-top:1px solid #e2e8f0; margin:12px 0 0 0;">
        </div>`;
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
    }

    async function render() {
      const offers = await getAllOffers();
      if (!offers.length) {
        list.innerHTML = '<div class="muted">Pasiūlymų kol kas nėra. Naudok formą kairėje arba spausk „Įkelti pavyzdžius“.</div>';
        return;
      }
      list.innerHTML = offers.map(card).join('');
      hookActions();
    }

    function hookActions() {
      list.querySelectorAll('[data-action="delete"]').forEach(btn => {
        btn.addEventListener('click', async (e) => {
          const id = e.target.closest('.offer').dataset.id;
          await deleteOffer(id);
          render();
        });
      });
      list.querySelectorAll('[data-action="apply"]').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const id = e.target.closest('.offer').dataset.id;
          alert('✅ Demo: paraiška išsiųsta. Pasiūlymo ID: ' + id);
        });
      });
    }

    // Formos pateikimas
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const offer = {
        id: uuid(),
        title:  form.elements.title?.value?.trim()  || 'Be pavadinimo',
        city:   form.elements.city?.value?.trim()   || '',
        company:form.elements.company?.value?.trim()|| '',
        desc:   form.elements.desc?.value?.trim()   || ''
      };
      await saveOffer(offer);
      form.reset();
      await render();
    });

    // Pavyzdžiai (seed)
    seedBtn.addEventListener('click', async () => {
      const demo = [
        { id: uuid(), title: 'Mūrininkas', city: 'Vilnius', company: 'UAB Statyba', desc: 'Objektas Pilaitėje, 3 sav. terminas.' },
        { id: uuid(), title: 'Apdailininkas', city: 'Kaunas', company: 'MB Namų Meistrai', desc: 'Butų apdaila, lankstus grafikas.' },
        { id: uuid(), title: 'Elektrikas', city: 'Klaipėda', company: 'Baltic Elektra', desc: 'Pramoniniai objektai, reikia pažymėjimo.' }
      ];
      for (const o of demo) await saveOffer(o);
      await render();
    });

    // Pirminis atvaizdavimas
    render();
  </script>

  <!-- Service Worker registracija -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/timurita/service-worker.js')
        .then(() => console.log('Service worker registered'))
        .catch(err => console.warn('SW error', err));
    }
  </script>
</body>
</html>
