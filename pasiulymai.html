<!doctype html>
<html lang="lt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Darbo pasiūlymai – Timurita</title>

  <link rel="stylesheet" href="./style.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.48.0/dist/umd/supabase.js"></script>

  <style>
    body { background:#020617; color:#e5e7eb; }

    /* Role meniu – toks pats stilius kaip admin */
    .role-menu {
      display:flex;
      gap:10px;
      overflow-x:auto;
      padding:10px;
      background:#0f172a;
      border-bottom:1px solid #1f2937;
    }
    .role-menu button {
      flex:0 0 auto;
      padding:8px 14px;
      border-radius:8px;
      background:#1e293b;
      color:white;
      border:1px solid #334155;
      font-size:14px;
      white-space:nowrap;
      cursor:pointer;
    }
    .role-menu button.active {
      background:#0369a1;
      border-color:#0ea5e9;
    }

    .pay-box {
      margin-top:8px;
      padding:8px;
      background:#0b1725;
      border:1px solid #1f2f47;
      border-radius:8px;
      color:#8ef;
      font-size:14px;
    }
    .warning-box {
      margin-top:10px;
      padding:10px;
      background:#2f1b00;
      border:1px solid #7a4300;
      border-radius:8px;
      color:#ffb84d;
      font-size:14px;
    }
    .info-text {
      font-size:13px;
      color:#9ca3af;
      margin-bottom:10px;
    }
  </style>
</head>

<body>

<header class="app-header">
  <h2>Darbo pasiūlymai</h2>
</header>

<!-- ROLE-BASED MENIU -->
<nav class="role-menu" id="roleMenu" style="display:none;">
  <!-- Darbuotojas -->
  <div id="menu-worker" style="display:none;">
    <button onclick="location.href='pasiulymai.html'">Pasiūlymai</button>
    <button onclick="location.href='profilis.html'">Mano profilis</button>
    <button onclick="location.href='patvirtintos-kandidaturos.html'">Patvirtintos kandidatūros</button>
  </div>

  <!-- Darbdavys (čia realiai į šį puslapį neturėtų patekti, bet paliekam struktūrai) -->
  <div id="menu-employer" style="display:none;">
    <button onclick="location.href='darbdavys.html'">Sukurti pasiūlymą</button>
    <button onclick="location.href='darbdavio-profilis.html'">Mano profilis</button>
    <button onclick="location.href='mano-pasiulymai.html'">Mano pasiūlymai</button>
    <button onclick="location.href='kandidatai.html'">Kandidatai</button>
  </div>
</nav>

<main class="container">
  <p id="topInfo" class="info-text"></p>
  <div id="offersList">Kraunama...</div>
</main>

<script>
  const supabaseClient = supabase.createClient(
    "https://qnczakppadjxbicgjzcy.supabase.co",
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFuY3pha3BwYWRqeGJpY2dqemN5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjI5NTYxMjcsImV4cCI6MjA3ODUzMjEyN30.0lAl6L1GU1_uWpULlraaKM0KIfy3lCNSI_wp2X5zDmY"
  );

  let currentUser = null;
  let currentProfile = null;

  // 💸 Darbuotojo atlygio lentelė
  const workerPay = {
    "Pagalbinis darbuotojas": "80 € / diena į rankas",
    "Darbuotojas betonuotojas": "100 € / diena į rankas",
    "Darbuotojas Valytoja/as": "7 € / val į rankas"
  };

  // 🔄 INIT
  (async () => {
    const { data: u } = await supabaseClient.auth.getUser();
    if (!u.user) {
      location.href = "./auth.html";
      return;
    }
    currentUser = u.user;

    const { data: p, error: pErr } = await supabaseClient
      .from("profiles")
      .select("*")
      .eq("id", currentUser.id)
      .maybeSingle();

    if (pErr || !p) {
      document.getElementById("offersList").innerHTML = "Klaida kraunant profilį.";
      return;
    }

    currentProfile = p;

    // Jei blokuotas – lauk
    if (currentProfile.is_blocked) {
      document.getElementById("offersList").innerHTML =
        "Jūsų paskyra užblokuota. Susisiekite su administracija.";
      return;
    }

    // ADMIN → admin.html
    if (currentProfile.role === "admin") {
      location.href = "./admin.html";
      return;
    }

    // DARBDAVYS → darbdavys.html (pasiūlymus kuria, ne žiūri kaip darbuotojas)
    if (currentProfile.role === "employer") {
      location.href = "./darbdavys.html";
      return;
    }

    // DARBUOTOJAS – rodom jo meniu
    if (currentProfile.role === "worker") {
      document.getElementById("roleMenu").style.display = "flex";
      document.getElementById("menu-worker").style.display = "flex";
      highlightActive("Pasiūlymai");

      if (!currentProfile.is_approved) {
        document.getElementById("topInfo").innerText =
          "Jūsų paskyra dar nepatvirtinta. Kandidatuoti ir matyti darbo užmokestį galėsite po patvirtinimo.";
      } else {
        document.getElementById("topInfo").innerText =
          "Pasirinkite patinkantį pasiūlymą ir kandidatuokite. Darbdavys jus patvirtins arba atmes.";
      }
    }

    loadOffers();
  })();

  function highlightActive(label) {
    document.querySelectorAll(".role-menu button").forEach(btn => {
      if (btn.textContent.trim() === label) {
        btn.classList.add("active");
      }
    });
  }

  // 📥 Kraunam pasiūlymus
  async function loadOffers() {
    const list = document.getElementById("offersList");

    const { data, error } = await supabaseClient
      .from("offers")
      .select("*")
      .eq("status", "approved")
      .order("created_at", { ascending: false });

    if (error) {
      list.innerHTML = "Klaida kraunant pasiūlymus.";
      return;
    }

    if (!data || !data.length) {
      list.innerHTML = "Šiuo metu pasiūlymų nėra.";
      return;
    }

    list.innerHTML = "";

    data.forEach(o => {
      const card = document.createElement("div");
      card.className = "card";

      let payInfo = "";

      // 💰 Jeigu darbuotojas
      if (currentProfile && currentProfile.role === "worker") {

        // Jei NEPATVIRTINTAS → įspėjimas, kainų ir mygtuko nerodom
        if (!currentProfile.is_approved) {
          payInfo = `
            <div class="warning-box">
              ⚠ Jūsų paskyra dar nepatvirtinta.<br>
              Darbo užmokestis ir kandidatavimo galimybė bus matoma tik po administratoriaus patvirtinimo.
            </div>
          `;
        } else {
          // Patvirtintas darbuotojas → rodome darbo užmokestį
          const pay = workerPay[o.title] || null;
          if (pay) {
            payInfo = `
              <div class="pay-box">
                💰 <strong>Darbo užmokestis:</strong><br>
                ${pay}
              </div>
            `;
          }
        }
      }

      const canApply = currentProfile &&
                       currentProfile.role === "worker" &&
                       currentProfile.is_approved;

      card.innerHTML = `
        <h3>${o.title}</h3>
        <p><strong>Miestas:</strong> ${o.city || "-"}</p>
        <p><strong>Įmonė:</strong> ${o.company || "-"}</p>
        <p><strong>Aprašymas:</strong> ${o.description || "-"}</p>
        <p><strong>Kontaktinis asmuo:</strong> ${o.contact || "-"}</p>
        <p><strong>Telefonas:</strong> ${o.phone || "-"}</p>
        <p><strong>El. paštas:</strong> ${o.email || "-"}</p>

        ${payInfo}

        ${canApply ? `
          <button class="btn" onclick="apply('${o.id}')">Kandidatuoti</button>
        ` : ""}
      `;

      list.appendChild(card);
    });
  }

  // 👷‍♂️ Darbuotojo kandidatavimas
  async function apply(offerId) {
    if (!currentProfile || currentProfile.role !== "worker") {
      alert("Tik darbuotojai gali kandidatuoti.");
      return;
    }

    if (!currentProfile.is_approved) {
      alert("Jūsų paskyra dar nepatvirtinta. Kandidatuoti galėsite po patvirtinimo.");
      return;
    }

    const { error } = await supabaseClient
      .from("applications")
      .insert({
        worker_id: currentUser.id,
        offer_id: offerId,
        status: "pending"
      });

    if (error) {
      alert("Klaida kandidatuojant: " + error.message);
      return;
    }

    alert("Kandidatuota sėkmingai! Laukite darbdavio sprendimo.");
  }

  // SW
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("./service-worker.js")
      .catch(e => console.log("SW error pasiulymai.html", e));
  }
</script>

</body>
</html>
