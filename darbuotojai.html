<!doctype html>
<html lang="lt" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Timurita – Darbuotojai</title>
  <meta name="description" content="Darbuotojų sąrašas – kurkite, filtruokite, eksportuokite ir importuokite JSON.">

  <link rel="manifest" href="/timurita/manifest.json">
  <meta name="theme-color" content="#1a2a44">
  <link rel="icon" href="/timurita/Timurita_logo_192x192.png" type="image/png">

  <link rel="stylesheet" href="/timurita/style.css">
  <style>
    :root{ --bg:#f8fafc; --fg:#0f172a; --muted:#475569; --line:#e2e8f0; --card:#fff; --primary:#0f766e; }
    [data-theme="dark"]{ --bg:#0b1220; --fg:#e5e7eb; --muted:#94a3b8; --line:#1f2937; --card:#101826; --primary:#10b981; }
    body{ font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; margin:0; background:var(--bg); color:var(--fg);}
    .app-header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--line);}
    .app-header img{width:40px;height:40px;border-radius:8px;}
    .theme-btn{padding:8px 12px;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:10px;cursor:pointer;}
    .container{max-width:960px;margin:0 auto;padding:16px;}
    .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:0 1px 2px rgba(0,0,0,0.05);margin-bottom:14px;}
    nav.bottom-nav{position:sticky;bottom:0;display:grid;grid-template-columns:repeat(4,1fr);background:color-mix(in oklab,var(--card) 92%,transparent);backdrop-filter:blur(6px);border-top:1px solid var(--line);padding:10px;}
    .bottom-nav a{text-align:center;text-decoration:none;padding:10px;border-radius:10px;color:var(--fg);font-weight:600;background:var(--card);border:1px solid var(--line);}
  </style>
</head>

<body>
  <header class="app-header">
    <div style="display:flex;align-items:center;gap:10px;">
      <a href="/timurita/index.html" style="display:flex;align-items:center;text-decoration:none;color:inherit">
        <img src="/timurita/Timurita_logo_192x192.png" alt="Timurita">
        <div>
          <h3 style="margin:0;">Timurita</h3>
          <div style="font-size:12px;color:var(--muted)">Darbuotojų sąrašas</div>
        </div>
      </a>
    </div>
    <button id="themeBtn" class="theme-btn" type="button">🌙 Tamsus</button>
  </header>

  <main class="container">
    <h1>Darbuotojai</h1>
    <p class="muted">Darbuotojų duomenys saugomi lokaliai (IndexedDB). Filtruokite, eksportuokite ar importuokite JSON.</p>

    <div id="list"></div>
  </main>

  <nav class="bottom-nav" aria-label="Navigacija">
    <a href="/timurita/darbuotojai.html" aria-current="page">Darbuotojai</a>
    <a href="/timurita/pasiulymai.html">Pasiūlymai</a>
    <a href="/timurita/profilis.html">Profilis</a>
    <a href="/timurita/darbdavys.html">Darbdavys</a>
  </nav>

  <script type="module">
    import { getAll } from '/timurita/db.js';
    import { initTheme } from '/timurita/theme.js';
    initTheme();

    const listEl = document.getElementById('list');
    async function render() {
      const data = await getAll('profiles');
      listEl.innerHTML = data.length
        ? data.map(p => `<article class="card"><h2>${p.name||''}</h2><p>${p.role||''} • ${p.city||''}</p><p>${p.about||''}</p></article>`).join('')
        : '<div class="card">🕐 Kol kas nėra darbuotojų.</div>';
    }
    render();
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/timurita/service-worker.js')
        .then(()=>console.log('SW registered'))
        .catch(e=>console.log('SW err', e));
    }
  </script>
</body>
</html>
