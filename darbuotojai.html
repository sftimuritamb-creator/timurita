<!doctype html>
<html lang="lt" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Timurita – Darbuotojai</title>
  <meta name="description" content="Darbuotojų sąrašas – kurkite, filtruokite, eksportuokite ir importuokite JSON." />

  <!-- PWA -->
  <link rel="manifest" href="/timurita/manifest.json">
  <meta name="theme-color" content="#1a2a44">
  <link rel="icon" href="/timurita/Timurita_logo_192x192.png" type="image/png">
  <link rel="apple-touch-icon" href="/timurita/Timurita_logo_512x512.png">

  <link rel="stylesheet" href="/timurita/style.css">
  <style>
    :root{ --bg:#f8fafc; --fg:#0f172a; --muted:#475569; --line:#e2e8f0; --card:#fff; --primary:#0f766e; }
    [data-theme="dark"]{ --bg:#0b1220; --fg:#e5e7eb; --muted:#94a3b8; --line:#1f2937; --card:#101826; --primary:#10b981; }
    body{ font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--fg); margin:0;}
    .app-header{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:12px 16px; background:var(--card); border-bottom:1px solid var(--line); }
    .left { display:flex; align-items:center; gap:10px;}
    .app-header img{ width:40px; height:40px; border-radius:8px; }
    .container{ max-width:1000px; margin:0 auto; padding:16px; }
    .grid{ display:grid; grid-template-columns: 1fr 2fr; gap:16px; }
    @media (max-width: 960px){ .grid{ grid-template-columns:1fr; } }
    .card{ background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; box-shadow:0 1px 2px rgba(0,0,0,0.04); }
    .muted{ color:var(--muted); }
    label{ display:block; margin-top:12px; font-weight:600; color:#334155; }
    [data-theme="dark"] label{ color:#cbd5e1; }
    input, textarea, select{ width:100%; padding:10px; border:1px solid var(--line); background:var(--card); color:var(--fg); border-radius:8px; margin-top:4px; }
    textarea{ min-height:80px; resize:vertical; }
    .row{ display:flex; gap:10px; }
    .row > *{ flex:1; }
    .btn{ padding:10px 14px; font-size:14px; font-weight:600; border:none; border-radius:10px; cursor:pointer; }
    .btn.primary{ background:var(--primary); color:#fff; }
    .btn.secondary{ background:transparent; color:var(--fg); border:1px solid var(--line); }
    .filters{ display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-bottom:12px; }
    .filters input{ min-width:160px; padding:8px 10px; border:1px solid var(--line); background:var(--card); color:var(--fg); border-radius:8px; }
    .chip{ display:inline-block; padding:2px 8px; border-radius:999px; border:1px solid var(--line); background:var(--bg); font-size:12px; margin-right:6px; }
    .worker{ display:flex; flex-direction:column; gap:6px; }
    .worker h3{ margin:0; }
    .worker .meta{ font-size:13px; color:var(--muted); }
    .worker .actions{ display:flex; gap:8px; margin-top:6px; }
    nav.bottom-nav{ position:sticky; bottom:0; display:grid; grid-template-columns:repeat(4,1fr); background:color-mix(in oklab, var(--card) 92%, transparent); backdrop-filter: blur(6px); border-top:1px solid var(--line); padding:10px; }
    .bottom-nav a{ text-align:center; text-decoration:none; padding:10px; border-radius:10px; color:var(--fg); font-weight:600; background:var(--card); border:1px solid var(--line); }
    .theme-btn{ padding:8px 12px; border:1px solid var(--line); background:var(--card); color:var(--fg); border-radius:10px; cursor:pointer; }
    @media (max-width: 720px){ .filters input{ flex:1 1 100%; } }
  </style>
</head>

<body>
  <header class="app-header">
    <div class="left">
      <a href="/timurita/index.html" style="display:flex;align-items:center;text-decoration:none;color:inherit">
        <img src="/timurita/Timurita_logo_192x192.png" alt="Timurita logotipas" width="40" height="40" loading="lazy" decoding="async">
        <div>
          <h3 style="margin:0;">Timurita</h3>
          <div style="font-size:12px;color:var(--muted)">Sujungiame darbdavius ir statybų specialistus</div>
        </div>
      </a>
    </div>
    <button id="themeBtn" class="theme-btn" type="button">🌙 Tamsus</button>
  </header>

  <main class="container">
    <h1>Darbuotojai</h1>
    <p class="muted">Kurkite darbuotojų korteles ir filtruokite pagal miestą, specialybę ar įgūdžius. Taip pat – <strong>eksportas</strong> ir <strong>importas</strong> (JSON). Veikia offline.</p>

    <div class="grid">
      <section class="card">
        <h2 style="margin:0;">Naujas darbuotojas</h2>
        <form id="workerForm" novalidate>
          <label>Vardas, pavardė *
            <input name="name" required placeholder="Pvz. Jonas Statybininkas">
          </label>

          <div class="row">
            <label>Miestas
              <input name="city" placeholder="Pvz. Vilnius">
            </label>
            <label>Telefonas
              <input name="phone" type="tel" placeholder="+3706..." autocomplete="tel">
            </label>
          </div>

          <div class="row">
            <label>Specialybė
              <select name="role">
                <option value="">– Pasirinkite –</option>
                <option>Mūrininkas</option>
                <option>Apdailininkas</option>
                <option>Elektrikas</option>
                <option>Santechnikas</option>
                <option>Stogdengys</option>
                <option>Pagalbinis darbininkas</option>
              </select>
            </label>
            <label>Patirtis (metais)
              <input name="exp" type="number" min="0" step="1" placeholder="Pvz. 3">
            </label>
          </div>

          <label>Įgūdžiai (kableliais)
            <input name="skills" placeholder="Pvz. glaistymas, dažymas, gipsas">
          </label>

          <label>Trumpas aprašymas
            <textarea name="about" placeholder="Apie patirtį, objektus, pažymėjimus..."></textarea>
          </label>

          <div class="row" style="margin-top:8px;">
            <button class="btn primary" type="submit">Išsaugoti</button>
            <button class="btn secondary" type="button" id="seedBtn">Įkelti pavyzdžius</button>
          </div>
          <div id="formMsg" class="muted" aria-live="polite" style="margin-top:8px;"></div>
        </form>
      </section>

      <section>
        <div class="card">
          <h2 style="margin:0 0 10px 0;">Filtrai ir veiksmai</h2>
          <div class="filters">
            <input id="fCity" placeholder="Miestas...">
            <input id="fRole" placeholder="Specialybė...">
            <input id="fSkill" placeholder="Įgūdis (pvz. dažymas)...">
            <button id="refreshBtn" class="btn primary" type="button">🔄 Atnaujinti</button>
            <button id="exportBtn" class="btn secondary" type="button">⬇️ Eksportuoti JSON</button>

            <input id="fileInput" type="file" accept="application/json" hidden>
            <button id="importAddBtn" class="btn secondary" type="button" title="Pridėti į esamus">⬆️ Importuoti (pridėti)</button>
            <button id="importReplaceBtn" class="btn secondary" type="button" title="Pakeisti visus">♻️ Importuoti (pakeisti)</button>
          </div>
        </div>

        <div id="list" class="list"></div>
      </section>
    </div>
  </main>

  <nav class="bottom-nav" aria-label="Apatinė navigacija">
    <a href="/timurita/darbuotojai.html" aria-current="page">Darbuotojai</a>
    <a href="/timurita/pasiulymai.html">Pasiūlymai</a>
    <a href="/timurita/profilis.html">Profilis</a>
    <a href="/timurita/darbdavys.html">Darbdavys</a>
  </nav>

  <script type="module">
    import { getAll, put, remove, clear, setSetting, getSetting } from '/timurita/db.js';

    // ---- Tema ----
    const themeBtn = document.getElementById('themeBtn');
    const applyTheme = (name) => {
      document.documentElement.setAttribute('data-theme', name);
      themeBtn.textContent = name === 'dark' ? '☀️ Šviesus' : '🌙 Tamsus';
    };
    (async () => {
      const saved = await getSetting('theme');
      const initial = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      applyTheme(initial);
    })();
    themeBtn.addEventListener('click', async () => {
      const cur = document.documentElement.getAttribute('data-theme') || 'light';
      const next = cur === 'dark' ? 'light' : 'dark';
      applyTheme(next);
      await setSetting('theme', next);
    });

    // ---- Darbuotojai ----
    const listEl   = document.getElementById('list');
    const form     = document.getElementById('workerForm');
    const formMsg  = document.getElementById('formMsg');
    const seedBtn  = document.getElementById('seedBtn');
    const fCity    = document.getElementById('fCity');
    const fRole    = document.getElementById('fRole');
    const fSkill   = document.getElementById('fSkill');
    const refresh  = document.getElementById('refreshBtn');
    const exportBtn= document.getElementById('exportBtn');
    const fileInput= document.getElementById('fileInput');
    const importAddBtn = document.getElementById('importAddBtn');
    const importReplaceBtn = document.getElementById('importReplaceBtn');

    const uuid = () => (crypto?.randomUUID?.() || 'id-' + Math.random().toString(36).slice(2, 10));
    const esc  = (s) => String(s||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
    const parseSkills = (txt) => (Array.isArray(txt) ? txt : (txt||'').split(',')).map(s => (s||'').toString().trim()).filter(Boolean);

    function workerCard(w) {
      const skills = (w.skills||[]).map(s => `<span class="chip">${esc(s)}</span>`).join(' ');
      return `
        <article class="card worker" data-id="${w.id}">
          <h3>${esc(w.name || '(be vardo)')}</h3>
          <div class="meta">${esc(w.role || 'Specialybė nenurodyta')} • ${esc(w.city || 'Miestas nenurodytas')} ${w.exp ? '• '+esc(w.exp)+' m.' : ''}</div>
          ${w.about ? `<div>${esc(w.about)}</div>` : ''}
          ${skills ? `<div>${skills}</div>` : ''}
          <div class="meta">Kontaktai: ${w.phone ? '📞 '+esc(w.phone) : ''}</div>
          <div class="actions">
            <button class="btn secondary" data-action="delete">Šalinti</button>
          </div>
        </article>
      `;
    }

    async function render() {
      const all = await getAll('profiles');
      let list = all.filter(w => w && w.id && w.id !== 'user-1');
      const city  = fCity.value.trim().toLowerCase();
      const role  = fRole.value.trim().toLowerCase();
      const skill = fSkill.value.trim().toLowerCase();

      if (city)  list = list.filter(w => (w.city || '').toLowerCase().includes(city));
      if (role)  list = list.filter(w => (w.role || '').toLowerCase().includes(role));
      if (skill) list = list.filter(w => parseSkills(w.skills).some(s => s.toLowerCase().includes(skill)));

      listEl.innerHTML = list.length
        ? list.map(workerCard).join('')
        : '<div class="card muted" style="text-align:center;">🕐 Kol kas nėra darbuotojų.</div>';

      listEl.querySelectorAll('[data-action="delete"]').forEach(btn => {
        btn.addEventListener('click', async (e) => {
          const id = e.target.closest('[data-id]').dataset.id;
          await remove('profiles', id);
          render();
        });
      });
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!form.name.value.trim()) {
        formMsg.textContent = '✋ Įrašykite vardą ir pavardę.';
        form.name.focus();
        return;
      }
      const worker = {
        id: uuid(),
        name: form.name.value.trim(),
        city: form.city.value.trim(),
        phone: form.phone.value.trim(),
        role: form.role.value.trim(),
        exp: form.exp.value ? parseInt(form.exp.value, 10) : 0,
        skills: parseSkills(form.skills.value),
        about: form.about.value.trim()
      };
      try {
        await put('profiles', worker);
        form.reset();
        formMsg.textContent = '✅ Darbuotojas išsaugotas (IndexedDB).';
        render();
      } catch (err) {
        console.warn('Nepavyko išsaugoti darbuotojo:', err);
        formMsg.textContent = '⚠️ Nepavyko išsaugoti darbuotojo.';
      }
    });

    seedBtn.addEventListener('click', async () => {
      const sample = [
        { id: uuid(), name:'Mantas Petrauskas', city:'Vilnius', role:'Mūrininkas',   exp:4, skills:['mūras','skiedinys'], phone:'+3706...', about:'Daugiabučiai, pramoniniai objektai.' },
        { id: uuid(), name:'Andrius Kairys',    city:'Kaunas',  role:'Apdailininkas', exp:6, skills:['glaistymas','dažymas','gipsas'], phone:'+3706...', about:'Butų apdaila, greitas grafikas.' },
        { id: uuid(), name:'Lina Jankauskė',    city:'Klaipėda',role:'Elektrikas',    exp:5, skills:['skydinės','instaliacija'], phone:'+3706...', about:'Sertifikatas B, pramonė.' }
      ];
      for (const w of sample) await put('profiles', w);
      render();
    });

    // Eksportas JSON
    function download(filename, data) {
      const blob = new Blob([data], { type: 'application/json;charset=utf-8' });
      const url  = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click();
      setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 0);
    }
    exportBtn.addEventListener('click', async () => {
      const all = await getAll('profiles');
      const list = all.filter(w => w && w.id && w.id !== 'user-1');
      download('darbuotojai.json', JSON.stringify(list, null, 2));
    });

    // Importas JSON (pridėti/pakeisti)
    async function handleImport(replaceAll=false) {
      const file = fileInput.files?.[0];
      if (!file) return;
      try {
        const text = await file.text();
        const arr = JSON.parse(text);
        if (!Array.isArray(arr)) throw new Error('JSON turi būti masyvas.');
        if (replaceAll) await clear('profiles');
        for (const raw of arr) {
          const worker = {
            id: raw.id || uuid(),
            name: (raw.name||'').toString(),
            city: (raw.city||'').toString(),
            phone:(raw.phone||'').toString(),
            role: (raw.role||'').toString(),
            exp:  Number.isFinite(raw.exp) ? raw.exp : parseInt(raw.exp||0,10),
            skills: parseSkills(raw.skills),
            about:(raw.about||raw.desc||'').toString()
          };
          await put('profiles', worker);
        }
        await render();
        alert('✅ Importas baigtas.');
      } catch (e) {
        alert('⚠️ Importo klaida: ' + e.message);
      } finally {
        fileInput.value = '';
      }
    }
    importAddBtn.addEventListener('click', () => { fileInput.onchange = () => handleImport(false); fileInput.click(); });
    importReplaceBtn.addEventListener('click', () => {
      if (!confirm('Ar tikrai pakeisti visus dabartinius darbuotojus importuojamais?')) return;
      fileInput.onchange = () => handleImport(true);
      fileInput.click();
    });

    [fCity, fRole, fSkill].forEach(el => el.addEventListener('input', render));
    document.getElementById('refreshBtn').addEventListener('click', render);

    render();
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/timurita/service-worker.js')
        .then(()=>console.log('Service worker registered'))
        .catch(e=>console.log('SW error', e));
    }
  </script>
</body>
</html>
