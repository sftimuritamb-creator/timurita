<!doctype html>
<html lang="lt">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Jūs esate neprisijungę – Timurita</title>
  <meta name="theme-color" content="#1a2a44">
  <style>
    :root { --fg:#0f172a; --muted:#64748b; --line:#e2e8f0; --bg:#f8fafc; --btn:#0f766e; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--fg); }
    .wrap { min-height:100dvh; display:grid; place-items:center; padding:24px; }
    .card { width:min(680px,100%); background:#fff; border:1px solid var(--line); border-radius:14px; padding:20px; box-shadow:0 1px 2px rgba(0,0,0,.05); }
    h1 { margin:0 0 8px 0; }
    p { margin:0 0 14px 0; color:var(--muted); }
    .row { display:flex; gap:10px; flex-wrap:wrap; margin-top:6px; }
    .btn { appearance:none; border:1px solid var(--line); background:#fff; color:var(--fg); padding:10px 14px; border-radius:10px; font-weight:600; cursor:pointer; }
    .btn.primary { background:var(--btn); color:#fff; border:none; }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card" role="status" aria-live="polite">
      <h1>Jūs esate neprisijungę</h1>
      <p>Tinklo ryšio nėra, o šis puslapis nebuvo įkeltas anksčiau. Galite grįžti į pradžią arba bandyti dar kartą.</p>
      <div class="row">
        <button class="btn primary" onclick="location.reload()">Bandyti dar kartą</button>
        <button class="btn" onclick="location.href='/timurita/index.html'">Į pradžią</button>
      </div>
      <p id="net" style="margin-top:10px;"></p>
    </section>
  </main>
  <script>
    function setNet(){
      const el=document.getElementById('net');
      el.textContent = navigator.onLine ? 'Ryšys atkurtas. Galite bandyti dar kartą.' : 'Ryšio vis dar nėra.';
    }
    addEventListener('online', setNet);
    addEventListener('offline', setNet);
    setNet();
  </script>
</body>
</html>
