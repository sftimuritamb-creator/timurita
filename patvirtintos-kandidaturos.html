<!doctype html>
<html lang="lt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Patvirtintos kandidatūros – Timurita</title>

  <link rel="stylesheet" href="./style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.48.0/dist/umd/supabase.js"></script>

  <style>
    body { background:#0f172a; color:white; }

    .card {
      background:#0f172a;
      border:1px solid #1f2937;
      margin-bottom:16px;
      padding:16px;
      border-radius:12px;
      box-shadow:0 10px 15px -3px rgba(0,0,0,0.4);
    }

    .status-approved {
      background:#022c22;
      color:#6ee7b7;
      border:1px solid #22c55e;
      padding:3px 8px;
      border-radius:999px;
      font-size:12px;
      display:inline-block;
      margin-bottom:8px;
    }

    .no-results {
      text-align:center;
      color:#94a3b8;
      padding:30px 10px;
      font-size:16px;
    }
  </style>
</head>

<body>

<header class="app-header">
  <h2>Patvirtintos kandidatūros</h2>
  <button class="btn small" onclick="logout()" style="margin-left:auto;">Atsijungti</button>
</header>

<main class="container">
  <div id="approvedList">Kraunama...</div>
</main>

<script>
  const supabaseClient = supabase.createClient(
    "https://qnczakppadjxbicgjzcy.supabase.co",
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFuY3pha3BwYWRqeGJpY2dqemN5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjI5NTYxMjcsImV4cCI6MjA3ODUzMjEyN30.0lAl6L1GU1_uWpULlraaKM0KIfy3lCNSI_wp2X5zDmY"
  );

  let currentUser = null;

  async function init() {
    const session = await supabaseClient.auth.getUser();
    if (!session.data.user) {
      location.href = "auth.html";
      return;
    }
    currentUser = session.data.user;

    loadApproved();
  }

  async function loadApproved() {
    const box = document.getElementById("approvedList");

    // 1. Pasiimame darbuotojo ID
    const workerId = currentUser.id;

    // 2. Pasiimame patvirtintas kandidatūras su pasiūlymų informacija
    const { data, error } = await supabaseClient
      .from("applications")
      .select(`
        id,
        status,
        offers (
          title,
          city,
          company,
          company_code,
          contact,
          phone,
          email
        )
      `)
      .eq("worker_id", workerId)
      .eq("status", "approved")
      .order("id", { ascending: false });

    if (error) {
      console.log(error);
      box.innerHTML = "<p class='no-results'>Klaida kraunant duomenis.</p>";
      return;
    }

    if (!data || data.length === 0) {
      box.innerHTML = "<p class='no-results'>Šiuo metu neturite patvirtintų kandidatūrų.</p>";
      return;
    }

    box.innerHTML = "";
    data.forEach(item => {
      const o = item.offers;

      const card = document.createElement("div");
      card.className = "card";

      card.innerHTML = `
        <span class="status-approved">Patvirtinta</span>

        <h3 style="margin-bottom:6px;">${o.title}</h3>

        <p><strong>Miestas:</strong> ${o.city}</p>
        <p><strong>Įmonė:</strong> ${o.company}</p>
        <p><strong>Įmonės kodas:</strong> ${o.company_code}</p>

        <br>

        <p><strong>Kontaktinis asmuo:</strong> ${o.contact}</p>
        <p><strong>Telefonas:</strong> ${o.phone}</p>
        <p><strong>El. paštas:</strong> ${o.email}</p>
      `;

      box.appendChild(card);
    });
  }

  async function logout() {
    await supabaseClient.auth.signOut();
    location.href = "auth.html";
  }

  init();
</script>

</body>
</html>
