<!DOCTYPE html>
<html lang="lt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Timurita – Pagrindinis</title>
  <link rel="stylesheet" href="./style.css">

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.48.0/dist/umd/supabase.js"></script>

  <style>
    body { background:#0f172a; color:white; }
    .center-box {
      text-align:center;
      padding:40px 20px;
      font-size:18px;
      color:#cbd5e1;
    }
  </style>
</head>

<body>

<header class="app-header">
  <h2>Timurita</h2>
</header>

<div class="center-box" id="loadingBox">
  Tikriname paskyrą, prašome palaukti...
</div>

<script>
  const supabaseClient = supabase.createClient(
    "https://qnczakppadjxbicgjzcy.supabase.co",
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFuY3pha3BwYWRqeGJpY2dqemN5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjI5NTYxMjcsImV4cCI6MjA3ODUzMjEyN30.0lAl6L1GU1_uWpULlraaKM0KIfy3lCNSI_wp2X5zDmY"
  );

  async function init() {
    const { data: userData, error: userErr } = await supabaseClient.auth.getUser();

    if (userErr || !userData.user) {
      // jei neprisijungęs → login
      location.href = "auth.html";
      return;
    }

    const user = userData.user;
    const loadingBox = document.getElementById("loadingBox");

    try {
      // bandome nuskaityti profilį
      let { data: profile, error: pErr } = await supabaseClient
        .from("profiles")
        .select("*")
        .eq("id", user.id)
        .maybeSingle();

      // jei profilio nėra – sukuriame automatiškai
      if (!profile) {
        const baseProfile = {
          id: user.id,
          role: user.user_metadata?.role || "worker",
          email: user.email,
          created_at: new Date().toISOString()
        };

        const { data: created, error: cErr } = await supabaseClient
          .from("profiles")
          .insert(baseProfile)
          .select()
          .single();

        if (cErr) {
          console.log("Klaida kuriant profilį:", cErr);
          loadingBox.innerText = "Klaida kuriant profilį. Bandykite dar kartą arba susisiekite su administracija.";
          return;
        }

        profile = created;
      } else if (pErr) {
        console.log("Klaida skaitant profilį:", pErr);
        loadingBox.innerText = "Klaida skaitant profilį. Bandykite dar kartą.";
        return;
      }

      // jeigu pažymėtas kaip blokuotas
      if (profile.is_blocked) {
        alert("Jūsų paskyra yra užblokuota. Susisiekite su administracija.");
        await supabaseClient.auth.signOut();
        location.href = "auth.html";
        return;
      }

      // 🔥 ADMIN → admin.html
      if (profile.role === "admin") {
        location.href = "admin.html";
        return;
      }

      // 👷‍♂️ DARBUOTOJAS → pasiūlymai
      if (profile.role === "worker") {
        location.href = "pasiulymai.html";
        return;
      }

      // 🏢 DARBDAVYS → darbdavys.html (pasiūlymų kūrimo)
      if (profile.role === "employer") {
        location.href = "darbdavys.html";
        return;
      }

      // jei rolė kažkokia keista
      loadingBox.innerHTML = "Nerasta jūsų rolė. Prašome susisiekti su administratoriumi.";

    } catch (e) {
      console.log("Netikėta klaida main.html:", e);
      document.getElementById("loadingBox").innerText =
        "Įvyko netikėta klaida. Bandykite perkrauti puslapį.";
    }
  }

  init();
</script>

</body>
</html>
