<!DOCTYPE html>
<html lang="lt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Timurita – Pagrindinis</title>
  <link rel="stylesheet" href="./style.css">

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.48.0/dist/umd/supabase.js"></script>

  <style>
    body { background:#0f172a; color:white; }
    .center-box {
      text-align:center;
      padding:40px 20px;
      font-size:18px;
      color:#cbd5e1;
    }
  </style>
</head>

<body>

<header class="app-header">
  <h2>Timurita</h2>
</header>

<!-- ROLE MENIU (rodomas tik kai vartotojas identifikuotas) -->
<nav class="role-menu" style="display:none;">
  <div id="menu-worker" style="display:none;">
    <button onclick="location.href='pasiulymai.html'">Pasiūlymai</button>
    <button onclick="location.href='profilis.html'">Mano profilis</button>
    <button onclick="location.href='patvirtintos-kandidaturos.html'">Patvirtintos kandidatūros</button>
  </div>

  <div id="menu-employer" style="display:none;">
    <button onclick="location.href='darbdavys.html'">Sukurti pasiūlymą</button>
    <button onclick="location.href='darbdavio-profilis.html'">Mano profilis</button>
    <button onclick="location.href='mano-pasiulymai.html'">Mano pasiūlymai</button>
    <button onclick="location.href='kandidatai.html'">Kandidatai</button>
  </div>
</nav>

<!-- Centrinė žinutė, jei rodom -->
<div class="center-box" id="loadingBox">
  Tikriname paskyrą, prašome palaukti...
</div>

<script>
  const supabaseClient = supabase.createClient(
    "https://qnczakppadjxbicgjzcy.supabase.co",
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFuY3pha3BwYWRqeGJpY2dqemN5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjI5NTYxMjcsImV4cCI6MjA3ODUzMjEyN30.0lAl6L1GU1_uWpULlraaKM0KIfy3lCNSI_wp2X5zDmY"
  );

  async function init() {
    const session = await supabaseClient.auth.getUser();

    if (!session.data.user) {
      // Jei neprisijungęs → į login
      location.href = "auth.html";
      return;
    }

    const user = session.data.user;

    // Gaunam profilį
    const { data: profile } = await supabaseClient
      .from("profiles")
      .select("*")
      .eq("id", user.id)
      .single();

    if (!profile) {
      document.getElementById("loadingBox").innerText =
        "Klaida: profilis nerastas.";
      return;
    }

    // ⛔ Blokuoti vartotojai
    if (profile.is_blocked) {
      alert("Jūsų paskyra yra užblokuota. Susisiekite su administracija.");
      await supabaseClient.auth.signOut();
      location.href = "auth.html";
      return;
    }

    // 🔥 ADMIN → admin.html
    if (profile.role === "admin") {
      location.href = "admin.html";
      return;
    }

    // 👷‍♂️ DARBUOTOJAS
    if (profile.role === "worker") {
      location.href = "pasiulymai.html";
      return;
    }

    // 🏢 DARBDAVYS
    if (profile.role === "employer") {
      location.href = "darbdavys.html";
      return;
    }

    // Jei kažkas ne taip
    document.getElementById("loadingBox").innerHTML =
      "Nerasta jūsų rolė. Prašome susisiekti su administratoriumi.";
  }

  init();
</script>

</body>
</html>
